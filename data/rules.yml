version: "3.1"

rules:

- rule: Despedirse cada vez que el usuario diga adiós
  steps:
  - intent: despedida
  - action: utter_despedida

- rule: Say 'I am a bot' anytime the user challenges
  steps:
  - intent: reto_bot
  - action: utter_soy_bot

- rule: Preguntar por documento id
  steps:
    - intent: consulta_documento_trazabilidad
    - action: consulta_documento_form
    - active_loop: consulta_documento_form

- rule: Enviar documento id
  condition:
    - active_loop: consulta_documento_form
  steps:
    - action: validate_consulta_documento_form
    - active_loop: null
    - slot_was_set:
        - requested_slot: null


