version: "3.1"

nlu:
- intent: saludo
  examples: |
    - hello
    - hola
    - qué tal
    - buenos días
    - buenas tardes
    - buenas noches
    - hola, ¿cómo estás?
    - ¿qué onda?
    - hola a todos
    - cómo andas
    - qué hay
    - hey
    - qué pasa
    - saludos
    - hola amigo
    - hola, buenas

- intent: despedida
  examples: |
    - adiós
    - nos vemos
    - hasta luego
    - que tengas un buen día
    - buenas noches
    - chau
    - hasta la próxima
    - cuídate
    - nos vemos luego

- intent: afirmacion
  examples: |
    - sí
    - claro
    - por supuesto
    - correcto
    - eso suena bien
    - exacto

- intent: negacion
  examples: |
    - no
    - nunca
    - no me gusta eso
    - de ninguna manera
    - no lo creo
    - no es así

- intent: animo_bien
  examples: |
    - perfecto
    - genial
    - increíble
    - me siento como un rey
    - maravilloso
    - me siento muy bien
    - estoy genial
    - estoy increíble
    - voy a salvar el mundo
    - súper feliz
    - extremadamente bien
    - tan perfecto
    - todo bien

- intent: animo_mal
  examples: |
    - mi día fue horrible
    - estoy triste
    - no me siento muy bien
    - estoy decepcionado
    - súper triste
    - muy triste
    - infeliz
    - no estoy bien
    - extremadamente triste
    - tan triste

- intent: reto_bot
  examples: |
    - ¿eres un bot?
    - ¿eres humano?
    - ¿estoy hablando con un bot?
    - ¿estoy hablando con un humano?

