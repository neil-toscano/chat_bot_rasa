version: "3.1"

nlu:
# >> 2.1. NLU - CERTIFICADO PRENUPCIAL:
- intent: certificado_prenupcial
  examples: |
    - ¿Cómo puedo solicitar el certificado prenupcial?
    - Quiero saber el procedimiento para obtener el certificado prenupcial
    - Solicitar certificado prenupcial
