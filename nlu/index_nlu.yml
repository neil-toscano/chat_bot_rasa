      - estoy genial
      - estoy increíble
      - voy a salvar el mundo
      - súper feliz
      - extremadamente bien
      - tan perfecto
      - todo bien

  - intent: animo_mal
    examples: |
      - mi día fue horrible
      - estoy triste
      - no me siento muy bien
      - estoy decepcionado
      - súper triste
      - muy triste
      - infeliz
      - no estoy bien
      - extremadamente triste
      - tan triste

  - intent: reto_bot
    examples: |
      - ¿eres un bot?
      - ¿eres humano?
      - ¿estoy hablando con un bot?
      - ¿estoy hablando con un humano?

  - intent: estado_cuenta
    examples: |
      - ¿Cuál es mi estado de cuenta?
      - Cómo saber mi estado de cuenta
      - Donde saber mi estado de cuenta
      - Cuanto debo a la municpalidad
      - Como pagar mi estado de cuenta

