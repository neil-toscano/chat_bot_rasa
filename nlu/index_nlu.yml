version: "3.1"

# >> NLU - INDEX
nlu:
  - intent: saludo
    examples: |
      - hola
      - hola señor
      - qué tal
      - buenos días
      - buenas tardes
      - buenas noches
      - hola, ¿cómo estás?
      - ¿qué onda?
      - hola a todos
      - cómo andas
      - qué hay
      - hey
      - qué pasa
      - saludos
      - hola amigo
      - hola, buenas
      - hi
      - hello
      - how are you

  - intent: despedida
    examples: |
      - adiós
      - nos vemos
      - hasta luego
      - que tengas un buen día
      - buenas noches hasta luego
      - chau
      - hasta la próxima
      - cuídate
      - nos vemos luego

