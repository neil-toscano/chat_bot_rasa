      - sí
      - claro
      - por supuesto
      - correcto
      - eso suena bien
      - exacto

  - intent: negacion
    examples: |
      - no
      - nunca
      - no me gusta eso
      - de ninguna manera
      - no lo creo
      - no es así

  - intent: animo_bien
    examples: |
