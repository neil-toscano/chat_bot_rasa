    examples: |
      - quiero saber sobre tramites de la municipalidad
      - quiero saber sobre los requisitos de algún trámite
      - cuales son los requisitos

  - intent: consulta_directorio
    examples: |
      - quiero saber sobre los números telefónicos de la municipalidad
      - quiero saber sobre los números telefónicos de algún departamento
      - cuales son los números telefónicos
      - cuales son los números telefónicos de algún departamento
      - cuales son los números telefónicos de algún departamento

  - intent: consulta_documento_trazabilidad
    examples: |
      - quiero saber el estado de mi trámite
      - ¿Dónde puedo consultar el estado de mi trámite?
      - ¿Cómo consulto mi código de seguimiento?
      - ¿Me puedes dar el código de seguimiento?
      - ¿Cómo puedo ver el estado de mi documento?
      - ¿Dónde está mi trámite?
      - ¿Puedo saber el estado de mi documento?
