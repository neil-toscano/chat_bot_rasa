responses:
  utter_constancia_posesion:
    - custom:
        blocks:
          - type: interactive
            interactive:
              type: list
              header:
                type: text
                text: '🟢 Opciones de Constancia de Posesión:'
              body:
                text: |
                  1. 📜 CONSTANCIA DE POSESIÓN PARA FINES DEL OTORGAMIENTO DE SERVICIOS BÁSICOS

              footer:
                text: '*Seleccione la opción abajo 👇*'

              # >> LISTADO DE OPCIONES :
              action:
                sections:
                  - title: Escoge la opción
                    rows:
                      - id: /constancia_posesion_servicios_basicos
                        title: 📜 Constancia
                button: Seleccionar Opción
  utter_formalizacion_promocion_empresarial:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                *Licencia de funcionamiento y anuncio publicitario*
                1. 🟢Licencia de funcionamiento para edificaciones calificadas con nivel de riesgo bajo
                      _(con ITSE posterior)_

                2. 🟡Licencia de funcionamiento para edificaciones calificadas con nivel de riesgo medio
                      _(con ITSE posterior)_

                3. 🔴Licencia de funcionamiento para edificaciones calificadas con nivel de riesgo alto
                      _(con ITSE previa)_

                4. ⚠️Licencia de funcionamiento para edificaciones calificadas con nivel de riesgo muy alto
                      _(con ITSE previa)_

                5. 🔄Transferencia de licencia de funcionamiento o cambio de denominación o nombre comercial de la persona jurídica

          - type: text
            text:
              # body: list
              # header:
              #   type: text
              #   text: "Consulta Trámites"
              preview_url: false
              body: |
                6. 🔃Licencia de funcionamiento para cambio de giro

                7. 🖼️Autorización para la ubicación de elemento de publicidad exterior sencillos - tipo: afiche y plancheta publicitaria, en bienes de dominio privado

                8. 🔤Autorización para la ubicación de elemento de publicidad exterior sencillos - tipo: letras recortadas, letrero, placa, y toldo, en bienes de dominio privado, vinculado a licencia de funcionamiento

                9. 📄Duplicado del certificado de licencia de funcionamiento

                10. 📜Duplicado de la resolución de autorización para la ubicación del elemento de publicidad exterior

                11. 📜Cese de licencia de funcionamiento
                *Seleccione la opción abajo 👇*

          - type: interactive
            interactive:
              type: list
              body:
                text: |
                  Seleccionar Publicidad - Duplicado

              action:
                sections:
                  - title: Escoja Opción
                    rows:
                      - id: /licencia_funcionamiento_edificacion_riesgo_bajo
                        title: 1. RIESGO BAJO 🟢
                      - id: /formalizacion_item02_edificacion_riesgo_medio
                        title: 2. RIESGO MEDIO 🟡
                      - id: /formalizacion_item03_edificacion_riesgo_alto
                        title: 3. RIESGO ALTO 🔴
                      - id: /formalizacion_item04_edificacion_riesgo_muy_alto
                        title: 4. RIESGO MUY ALTO ⚠️
                      - id: /formalizacion_item05_transferencia_licencia_funcionamiento
                        title: 5. TRANSFERENCIA 🔄
                      - id: /formalizacion_item06_licencia_funcionamiento_cambio_giro
                        title: 6. CAMBIO DE GIRO 🔃
                button: Seleccionar (1 - 6)
          - type: interactive
            interactive:
              type: list
              body:
                text: |
                  Seleccionar Licencia - Transferencia

              action:
                sections:
                  - title: Escoja Opción
                    rows:
                      - id: /formalizacion_item07_autorizacion_publicidad_exterior_afiche
                        title: 7. PUBLICIDAD 🖼️
                      - id: /formalizacion_item08_autorizacion_publicidad_exterior_letras
                        title: 8. PUBLICIDAD LETRAS 🔤
                      - id: /formalizacion_item09_duplicado_certificado
                        title: 9. DUPLICADO 📄
                      - id: /formalizacion_item10_duplicado_resolucion
                        title: 10. DUP. RESOLUCIÓN 📜
                      - id: /formalizacion_item11_cese_licencia
                        title: 11. CESE LICENCIA 📜
                      - id: /formalizacion_item12_transferencia_licencia
                        title: 12. TRANSFERENCIA 🔄
                button: Seleccionar (7-12)
  utter_gestion:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                *🟢 Opciones de Trámite:*  

                1. 🏢🟢 Inspección Técnica de Seguridad en edificaciones posterior al inicio de actividades para establecimientos objeto de inspección clasificados con *Nivel de Riesgo Bajo*  

                2. 🔄🟢 Renovación del Certificado de Inspección Técnica de Seguridad en edificaciones para establecimientos objeto de inspección clasificados con *Nivel de Riesgo Bajo*  

                3. 🏢🟡 Inspección Técnica de Seguridad en edificaciones posterior al inicio de actividades para establecimientos objeto de inspección clasificados con **Nivel de Riesgo Medio*  

                4. 🔄🟡 Renovación del Certificado de Inspección Técnica de Seguridad en edificaciones para establecimientos objeto de inspección clasificados con *Nivel de Riesgo Medio*  

                5. 🏢🟠 Inspección Técnica de Seguridad en edificaciones previa al inicio de actividades para establecimientos objeto de inspección clasificados con *Nivel de Riesgo Alto*

          - type: interactive
            interactive:
              type: list
              body:
                text: |
                  6. 🔄🟠 Renovación del Certificado de Inspección Técnica de Seguridad en edificaciones para establecimientos objeto de inspección clasificados con *Nivel de Riesgo Alto*  

                  7. 🏢🔴 Inspección Técnica de Seguridad en edificaciones previa al inicio de actividades para establecimientos objeto de inspección clasificados con *Nivel de Riesgo Muy Alto*  

                  8. 🔄🔴 Renovación del Certificado de Inspección Técnica de Seguridad en edificaciones para establecimientos objeto de inspección clasificados con *Nivel de Riesgo Muy Alto*  

                  9. 🏟️ Evaluación de Condiciones de Seguridad en espectáculos públicos deportivos y no deportivos (ECSE) con una concurrencia de hasta *3,000 personas* 

                  10. 📄 Duplicado del Certificado de Inspección Técnica de Seguridad en edificaciones

              footer:
                text: '*Seleccione la opción abajo 👇*'

              # >> LISTADO DE OPCIONES :
              action:
                sections:
                  - title: Escoge la opción
                    rows:
                      - id: /gestion_item01
                        title: 1. 🏢🟢 INSPECCIÓN BAJO
                      - id: /gestion_item02
                        title: 2. 🔄🟢 RENOVACIÓN BAJO
                      - id: /gestion_item03
                        title: 3. 🏢🟡 INSPECCIÓN MEDIO
                      - id: /gestion_item04
                        title: 4. 🔄🟡 RENOVACIÓN MEDIO
                      - id: /gestion_item05
                        title: 5. 🏢🟠 INSPECCIÓN ALTO
                      - id: /gestion_item06
                        title: 6. 🔄🟠 RENOVACIÓN ALTO
                      - id: /gestion_item07
                        title: 7. 🏢🔴 INSP. MUY ALTO
                      - id: /gestion_item08
                        title: 8. 🔄🔴 RENOV. MUY ALTO
                      - id: /gestion_item09
                        title: 9. 🏟️ EVALUACIÓN
                      - id: /gestion_item10
                        title: 10. 📄 DUPLICADO
                button: Seleccionar Opción

