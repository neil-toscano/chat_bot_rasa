  # >> 4.4... CONSULTA
  utter_registro_item04_consulta:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                💔 Procedimiento mediante el cual ambos cónyuges manifiestan ante la autoridad municipal su voluntad de separarse.

                *¿Para qué es necesario?*

                📝 La separación convencional sirve para que los cónyuges formalicen su decisión de vivir separados sin disolver inmediatamente el matrimonio.

  # >> 4.4... NECESIDAD
  utter_registro_item04_necesidad:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                1. 📝 Solicitud al alcalde manifestando su voluntad de separación, con DNI, dirección, firma y huella de los cónyugues.

                2. 📑 Copia certificada del acta o de la partida de matrimonio.

                3. 🏠 Declaración jurada del último domicilio conyugal.

                4. ✍️ En caso de haber representantes, adjuntar un poder notarial específico registrado.

                5. 🆔 Exhibición de los DNI de ambos cónyuges y de los representantes legales, si los hay.

                6. 💵 Indicar fecha y número de constancia de pago.

          - type: interactive
            interactive:
