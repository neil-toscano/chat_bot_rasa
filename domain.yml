            body:
                text: '¡Hola! Soy el asistente virtual de la MUNICIPALIDAD DISTRITAL
                    SAN JUAN DE LURIGANCHO.

                    ¿Sobre qué área te gustaría obtener información? Por favor, elige
                    una de las siguientes opciones:

                    1. FORMALIZACIÓN Y PROMOCIÓN EMPRESARIAL

                    2. GESTIÓN DEL RIESGO DE DESASTRES

                    3. ORIENTACIÓN Y REGISTRO

                    4. REGISTRO CIVIL

                    5. OBRAS PRIVADAS Y HABILITACIÓN URBANA

                    '
