  # >> 4.2... CONSULTA
  utter_registro_item02_consulta:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                💍 Es la publicación de la celebración del matrimonio en un determinado distrito, cuando el domicilio de uno de los contrayentes es distinto al distrito en el cual se consigna el domicilio del DNI.

                *¿Para qué es necesario?*

                📢 Permite que cualquier ciudadano que conozca de la existencia de algún impedimento pueda denunciarlo.

  # >> 4.2... NECESIDAD
  utter_registro_item02_necesidad:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                1. 📝 Solicitud con carácter de Declaración Jurada.

                2. 📑 Copia simple del Edicto Matrimonial.

                3. 💵 Indicar fecha y número de constancia de pago.

  # >> 4.2... COSTO
  utter_registro_item02_costo:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
