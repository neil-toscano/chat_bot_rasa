  utter_saludo:
  - custom:
      blocks:
        - type: interactive
          interactive:
            type: list
            header:
              type: text
              text: "Consulta Trámites"
            body:
                text: |
                  ¡Hola! Soy el asistente virtual de la MUNICIPALIDAD DISTRITAL SAN JUAN DE LURIGANCHO.
                  ¿Sobre qué área te gustaría obtener información? Por favor, elige una de las siguientes opciones:
                  1. FORMALIZACIÓN Y PROMOCIÓN EMPRESARIAL
                  2. GESTIÓN DEL RIESGO DE DESASTRES
                  3. ORIENTACIÓN Y REGISTRO
                  4. REGISTRO CIVIL
                  5. OBRAS PRIVADAS Y HABILITACIÓN URBANA
            footer:
              text: "seleccione el trámite abajo"
            action:
              sections:
                - title: "Escoja trámite"
                  rows:
                    - id: "/formalizacion_promocion_empresarial"
                      title: "Trámite 1"
                      description: "Formalización"
                    - id: "/gestion_riesgo_desastre"
                      title: "Trámite 2"
                      description: "Gestión"
                    - id: "/orientacion_registro"
                      title: "Trámite 3"
                      description: "Orientación"
                    - id: "/registro_civil"
                      title: "Trámite 4"
                      description: "Registro"
                    - id: "/obras_privadas_habilitacion_urbana"
                      title: "Trámite 5"
                      description: "Obras"
              button: "Seleccionar consulta"

# FORMALIZACIÓN Y PROMOCIÓN EMPRESARIAL

# ==========*=============
  utter_formalizacion_promocion_empresarial:
  - custom:
      blocks:
        - type: "text"
          text:
            preview_url: false
            body: |
                *🟢Opciones de Trámite:*
                1️. licencia de funcionamiento para edificaciones calificadas con nivel de riesgo bajo
                  _(con ITSE posterior)_

                2️. licencia de funcionamiento para edificaciones calificadas con nivel de riesgo medio
                  _(con ITSE posterior)_

                3️. Licencia de funcionamiento para edificaciones calificadas con nivel de riesgo alto
                  _(con ITSE posterior)_
                
                4. Licencia de funcionamiento para edificaciones calificadas con nivel de riesgo muy alto
                  _(con ITSE posterior)_

                5. Transferencia de licencia de funcionamiento o cambio de denominación o nombre comercial de la persona jurídica
                
        - type: interactive
          interactive:
            type: list
            header:
              type: text
              text: "Consulta Trámites"
            body:
              text: |
                6. Licencia de funcionamiento para cambio de giro
                
                7. Autorización para la ubicación de elemento de publicidad exterior sencillos - tipo: afiche y plancheta publicitaria, en bienes de dominio privado
                
                8. Autorización para la ubicación de elemento de publicidad exterior sencillos - tipo: letras recortadas, letrero, placa, y toldo, en bienes de dominio privado, vinculado a licencia de funcionamiento
                
                9. Duplicado del certificado de licencia de funcionamiento
                
                10. Duplicado de la resolución de autorización para la ubicación del elemento de publicidad exterior

            footer:
              text: "**Seleccione el trámite abajo**"

            action:
              sections:
                - title: "Escoja trámite"
                  rows:
                    - id: "/licencia_funcionamiento_edificacion_riesgo_bajo"
                      title: "Trámite 1"
                      description: "RIESGO BAJO"
                    - id: "/licencia_funcionamiento_edificacion_riesgo_medio"
                      title: "Trámite 2"
                      description: "RIESGO MEDIO"
                    - id: "/licencia_funcionamiento_edificacion_riesgo_alto"
                      title: "Trámite 3"
                      description: "RIESGO ALTO"
                    - id: "/licencia_funcionamiento_edificacion_riesgo_muy_alto"
                      title: "Trámite 4"
                      description: "RIESGO MUY ALTO"
                    - id: "/transferencia_licencia_cambio_denominacion"
                      title: "Trámite 5"
                      description: "TRANSFERENCIA O CAMBIO"
                    - id: "/licencia_funcionamiento_cambio_giro"
                      title: "Trámite 6"
                      description: "CAMBIO DE GIRO"
                    - id: "/autorizacion_publicidad_afiche_privada"
                      title: "Trámite 7"
                      description: "PUBLICIDAD AFICHE"
                    - id: "/autorizacion_publicidad_letras_privada"
                      title: "Trámite 8"
                      description: "PUBLICIDAD LETRAS"
                    - id: "/duplicado_certificado_funcionamiento"
                      title: "Trámite 9"
                      description: "DUPLICADO"
                    - id: "/duplicado_resolucion_autorizacion"
                      title: "Trámite 10"
                      description: "DUPLICADO RESOLUCIÓN"
              button: "Opciones"

# ===========**====================
  utter_licencia_funcionamiento_edificacion_riesgo_bajo:
  - custom:
      blocks:
        - type: interactive
          interactive:
            type: list
            header:
              type: text
              text: "Consulta Trámites"
            body:
              text: |
                *Haz seleccionado licencia de funcionamiento de edificacion de riesgo bajo*

                *🟢Opciones de pregunta:*
                1️. ¿Qué es?

                2️. ¿Qué necesito?

                3️. ¿Cuánto cuesta el derecho de trámite?
            footer:
              text: "**Seleccione la pregunta abajo**"

            action:
              sections:
                - title: "Escoja la pregunta"
                  rows:
                    - id: "/licencia_funcionamiento_edificacion_riesgo_bajo_que_es"
                      title: "Trámite 1"
                      description: "¿Qué es?"
                    - id: "/licencia_funcionamiento_edificacion_riesgo_bajo_que_necesito"
                      title: "Trámite 2"
                      description: "¿Qué necesito?"
                    - id: "/licencia_funcionamiento_edificacion_riesgo_bajo_cuanto_cuesta"
                      title: "Trámite 3"
                      description: "¿Cuánto cuesta?"
              button: "Opciones"

# ==========***=======================

  utter_licencia_funcionamiento_edificacion_riesgo_bajo_que_es:
  - custom:
      blocks:
        - type: "text"
          text:
            preview_url: false
            body: |
                Es un permiso otorgado por la municipalidad para que un negocio inicie su actividad comercial  en un local que ha sido clasificado como de riesgo bajo
  
  utter_licencia_funcionamiento_edificacion_riesgo_bajo_que_necesito:
  - custom:
      blocks:
        - type: "text"
          text:
            preview_url: true
            body: |
                Es un permiso otorgado por la municipalidad para que un negocio inicie su actividad comercial  en un local que ha sido clasificado como de riesgo bajo \n https://www.meta.com/quest/quest-3
  
        - type: "text"
          text:
            preview_url: true
            body: |
                Declaración jurada de cumplimiento de las condiciones de seguridad en la edificación. \n https://www.meta.com/quest/quest-3
  
        - type: "text"
          text:
            preview_url: true
            body: |
                Declaración jurada de representante legal, en el caso de personas jurídicas, Copia literal de la vigencia de poder actualizada
  
  utter_licencia_funcionamiento_edificacion_riesgo_bajo_cuanto_cuesta:
  - custom:
      blocks:
        - type: "text"
          text:
            preview_url: false
            body: |
                S/ 229.20
