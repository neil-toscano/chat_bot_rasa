responses:
  utter_formalizacion_promocion_empresarial:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                *🟢 Opciones de Trámite:*
                1. Licencia de funcionamiento para edificaciones calificadas con nivel de riesgo bajo _(con ITSE posterior)_

                2. Licencia de funcionamiento para edificaciones calificadas con nivel de riesgo medio _(con ITSE posterior)_

                3. Licencia de funcionamiento para edificaciones calificadas con nivel de riesgo alto _(con ITSE posterior)_

                4. Licencia de funcionamiento para edificaciones calificadas con nivel de riesgo muy alto _(con ITSE posterior)_

                5. Transferencia de licencia de funcionamiento o cambio de denominación o nombre comercial de la persona jurídica

          - type: interactive
            interactive:
              type: list
              body:
                text: |
                  6. Licencia de funcionamiento para cambio de giro

                  7. Autorización para la ubicación de elemento de publicidad exterior sencillos - tipo: afiche y plancheta publicitaria, en bienes de dominio privado

                  8. Autorización para la ubicación de elemento de publicidad exterior sencillos - tipo: letras recortadas, letrero, placa, y toldo, en bienes de dominio privado, vinculado a licencia de funcionamiento

                  9. Duplicado del certificado de licencia de funcionamiento

                  10. Duplicado de la resolución de autorización para la ubicación del elemento de publicidad exterior

              footer:
                text: '**Seleccione el trámite abajo**'

            # >> LISTADO DE OPCIONES :
              action:
                sections:
                  - title: Escoge el trámite
                    rows:
                      - id: /licencia_funcionamiento_edificacion_riesgo_bajo
