                2. Copia certificada del acta o de la partida de matrimonio.

                3. Declaración jurada del último domicilio conyugal.

                4. En caso de haber representantes, adjuntar un poder notarial específico registrado.

                5. Exhibición de los DNI de ambos cónyuges y de los representantes legales, si los hay.

                6. Indicar fecha y número de constancia de pago.

