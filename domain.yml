                eléctricas).


                7. Constancia de mantenimiento de extintores.


                8. Plan de seguridad con señalización, rutas de evacuación, y zonas
                seguras.


                9. Declaración de instalación segura de gas licuado (si aplica).


                10. Memoria descriptiva de seguridad para juegos mecánicos (si se
                usan).


                11. Certificado de inspección técnica de seguridad (ITSE) si el recinto
                no lo ha emitido la Municipalidad.

