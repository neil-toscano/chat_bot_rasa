                        id: /gestion_item09
                        title: Trámite 9
                    -   description: DUPLICADO
                        id: /gestion_item10
                        title: Trámite 10
                    title: Escoge el trámite
            body:
                text: '6. Renovación del Certificado de Inspección Técnica de Seguridad
                    en edificaciones para establecimientos objeto de inspección clasificados
                    con Nivel de Riesgo Alto


                    7. Inspección Técnica de Seguridad en edificaciones previa al
                    inicio de actividades para establecimientos objeto de inspección
                    clasificados con Nivel de Riesgo Muy Alto


                    8. Renovación del Certificado de Inspección Técnica de Seguridad
                    en edificaciones para establecimientos objeto de inspección clasificados
                    con Nivel de Riesgo Muy Alto


                    9. Evaluación de Condiciones de Seguridad en espectáculos públicos
                    deportivos y no deportivos (ECSE) con una concurrencia de hasta
                    3,000 personas


                    10. Duplicado del Certificado de Inspección Técnica de Seguridad
                    en edificaciones

                    '
            footer:
                text: '**Seleccione el trámite abajo**'
