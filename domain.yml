                        title: Trámite 2
                    -   description: RIESGO ALTO
                        id: /licencia_funcionamiento_edificacion_riesgo_alto
                        title: Trámite 3
                    -   description: RIESGO MUY ALTO
                        id: /licencia_funcionamiento_edificacion_riesgo_muy_alto
                        title: Trámite 4
                    -   description: TRANSFERENCIA O CAMBIO
                        id: /transferencia_licencia_cambio_denominacion
                        title: Trámite 5
                    -   description: CAMBIO DE GIRO
                        id: /licencia_funcionamiento_cambio_giro
                        title: Trámite 6
                    -   description: PUBLICIDAD AFICHE
                        id: /autorizacion_publicidad_afiche_privada
                        title: Trámite 7
                    -   description: PUBLICIDAD LETRAS
                        id: /autorizacion_publicidad_letras_privada
                        title: Trámite 8
                    -   description: DUPLICADO
                        id: /duplicado_certificado_funcionamiento
                        title: Trámite 9
                    -   description: DUPLICADO RESOLUCIÓN
                        id: /duplicado_resolucion_autorizacion
                        title: Trámite 10
                    title: Escoge el trámite
            body:
                text: '6. Licencia de funcionamiento para cambio de giro


                    7. Autorización para la ubicación de elemento de publicidad exterior
                    sencillos - tipo: afiche y plancheta publicitaria, en bienes de
                    dominio privado


                    8. Autorización para la ubicación de elemento de publicidad exterior
                    sencillos - tipo: letras recortadas, letrero, placa, y toldo,
                    en bienes de dominio privado, vinculado a licencia de funcionamiento


                    9. Duplicado del certificado de licencia de funcionamiento


                    10. Duplicado de la resolución de autorización para la ubicación
                    del elemento de publicidad exterior

                    '
            footer:
                text: '**Seleccione el trámite abajo**'
            type: list
        type: interactive

  # >> UTTER GESTION :
  utter_gestion:
custom:
    blocks:
    -   text:
            body: '*🟢 Opciones de Trámite:*


                1. Inspección Técnica de Seguridad en edificaciones posterior al inicio
