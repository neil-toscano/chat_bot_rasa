                        title: Trámite 6
                        description: CAMBIO DE GIRO
                      - id: /autorizacion_publicidad_afiche_privada
                        title: Trámite 7
                        description: PUBLICIDAD AFICHE
                      - id: /autorizacion_publicidad_letras_privada
                        title: Trámite 8
                        description: PUBLICIDAD LETRAS
                      - id: /duplicado_certificado_funcionamiento
                        title: Trámite 9
