                3. 💍 Certificado de Soltería emitido por el Consulado Peruano y legalizado por el Ministerio de Relaciones Exteriores.

                4. 📑 Inventario Judicial o Declaración Jurada de no tener hijos bajo su patria potestad o de que éstos no tienen bienes.

