  # >> 2.1... CONSULTA
  utter_gestion_item01_consulta:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                📘 Es una inspección técnica de seguridad que se realiza en establecimientos con nivel de riesgo bajo.  

                *¿Para qué sirve?*  

                📋 Para garantizar que el establecimiento cumpla con las normativas de seguridad y proporciona un entorno seguro para los ocupantes y visitantes.

  # >> 2.1... NECESIDAD
  utter_gestion_item01_necesidad:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: true
              body: |
                a. 📄Solicitud de inspecciòn tècnica de seguridad en edificaciónes(ITSE) y de evaluación de condiciones de seguridad en espectàculos pùblicos deportivos y no deportivos(ECSE)(anexo 1)
                    👉https://web.munisjl.gob.pe/web/pdf/rdesastres/ANEXO01.pdf

