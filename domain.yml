                2. Renovación del Certificado de Inspección Técnica de Seguridad en
                edificaciones para establecimientos objeto de inspección clasificados
                con Nivel de Riesgo Bajo


                3. Inspección Técnica de Seguridad en edificaciones posterior al inicio
                de actividades para establecimientos objeto de inspección clasificados
                con Nivel de Riesgo Medio


                4. Renovación del Certificado de Inspección Técnica de Seguridad en
                edificaciones para establecimientos objeto de inspección clasificados
                con Nivel De Riesgo Medio


                5. Inspección Técnica de Seguridad en edificaciones previa al inicio
                de actividades para establecimientos objeto de inspección clasificados
                con Nivel de Riesgo Alto

                '
            preview_url: false
        type: text
    -   interactive:
