  # >> UTTER FORMALIZACION PROMOCION EMPRESARIAL :
  utter_formalizacion_promocion_empresarial:
custom:
    blocks:
    -   text:
            body: '*🟢 Opciones de Trámite:*

                1. Licencia de funcionamiento para edificaciones calificadas con nivel
                de riesgo bajo _(con ITSE posterior)_


                2. Licencia de funcionamiento para edificaciones calificadas con nivel
                de riesgo medio _(con ITSE posterior)_


                3. Licencia de funcionamiento para edificaciones calificadas con nivel
                de riesgo alto _(con ITSE posterior)_


                4. Licencia de funcionamiento para edificaciones calificadas con nivel
                de riesgo muy alto _(con ITSE posterior)_


                5. Transferencia de licencia de funcionamiento o cambio de denominación
                o nombre comercial de la persona jurídica

                '
            preview_url: false
        type: text
    -   interactive:
            action:
                button: Opciones
                sections:
                -   rows:
                    -   description: RIESGO BAJO
                        id: /licencia_funcionamiento_edificacion_riesgo_bajo
