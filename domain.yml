          - type: text
            text:
              preview_url: false
              body: |
                📋 *Requisitos para el trámite:*

                1. 🆔 Exhibición de los DNI de los contrayentes y testigos al abrir el expediente matrimonial.

                2. 🍼 Copia certificada de Partida de Nacimiento de los contrayentes.

                3. 📝 Declaración Jurada de dos testigos que conozcan a los contrayentes, según el formato de la Municipalidad.

                4. 💉 Certificado Médico Pre-Nupcial y Constancia de Charlas de Consejería, antigüedad no mayor a 30 días.

                5. 🏡 Declaración Jurada de Domicilio (debe residir en el distrito).

                6. 💰 Indicar la fecha y número de constancia de pago.

          - type: interactive
            interactive:
              type: list
