                f. 🛠️ Descripción del elemento, procedimiento de instalación y mantenimiento
                g. 🏛️ Aprobación del Ministerio de Cultura si el elemento está en una zona protegida
                h. 📑 En el caso de personas jurídicas, Declaración jurada de representante legal, N° de partida electrónico y asiento de inscripción SUNARP (vigente)

