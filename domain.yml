                2. 🆔 DNI actualizado.

                3. 📄 Declaración Jurada de no administrar bienes de hijos menores.

                4. 🏥 En el caso de la mujer, haber transcurrido 300 días desde el divorcio, y presentar constancia médica de NO EMBARAZO.

  # >> 4.4.2... SUBNECESIDAD 02
