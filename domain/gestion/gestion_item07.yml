version: "3.1"

intents:
  - gestion_item07_consulta
  - gestion_item07_necesidad
  - gestion_item07_costo

responses:

  # >> 2.7. INSPECCIÓN RIESGO MUY ALTO
  utter_gestion_item07:
  - custom:
      blocks:
        - type: interactive
          interactive:
            type: list
            header:
              type: text
              text: "Consulta Trámites"
            body:
              text: |
                Haz seleccionado *Inspección Técnica de Seguridad en edificaciones previa al inicio de actividades para establecimientos objeto de inspección clasificados con Nivel de Riesgo Muy Alto*

                *🟢 Opciones de pregunta:*

                1. ¿Qué es?

                2. ¿Qué necesito?

                3. ¿Cuánto cuesta el derecho de trámite?
            footer:
              text: "**Seleccione la pregunta abajo**"

            action:
              sections:
                - title: "Escoge la pregunta"
                  rows:
                    - id: "/gestion_item07_consulta"
                      title: "Pregunta 1"
                      description: "¿Qué es?"
                    - id: "/gestion_item07_necesidad"
                      title: "Pregunta 2"
                      description: "¿Qué necesito?"
                    - id: "/gestion_item07_costo"
                      title: "Pregunta 3"
                      description: "¿Cuánto cuesta?"
              button: "Opciones"

  # >> 2.7... CONSULTA
  utter_gestion_item07_consulta:
  - custom:
      blocks:
        - type: text
          text:
            preview_url: false
            body: |
                Es una evaluación técnica de seguridad realizada antes de que un establecimiento con nivel de riesgo muy alto comience sus actividades

                *¿Para qué es necesario*

                Garantiza que el establecimiento cumpla con todas las normativas de seguridad críticas para minimizar riesgos y proteger a los ocupantes y visitantes.

  # >> 2.7... NECESIDAD
  utter_gestion_item07_necesidad:
  - custom:
      blocks:
        - type: text
          text:
            preview_url: true
            body: |
                Solicitud de renovación ITSE, indicando número y fecha de pago. \n http://sut.pcm.gob.pe/sutArchivos/file_1487_20230418_112532.pdf
  
        - type: text
          text:
            preview_url: true
            body: |
                Declaración jurada de cumplimiento de Seguridad en Edificaciones. \n http://sut.pcm.gob.pe/sutArchivos/file_1487_20230418_112413.pdf

        - type: text
          text:
            preview_url: false
            body: |
                Documentos técnicos en copia simple:

                1. Croquis de ubicación

                2. Plano de arquitectura y detalle de aforo

                3. Plano de distribución eléctrica y cargas

                4. Certificado vigente de puesta a tierra

                5. Plan de seguridad del establecimiento

                6. Memoria de prueba de mantenimiento de equipos y protección contra incendios

  # >> 2.7... COSTO
  utter_gestion_item07_costo:
  - custom:
      blocks:
        - type: text
          text:
            preview_url: false
            body: |
                S/ 699.70
