version: "3.1"

intents:
  - gestion_item07_consulta
  - gestion_item07_necesidad
  - gestion_item07_costo

responses:
  # >> 2.7. INSPECCIÓN RIESGO MUY ALTO
  utter_gestion_item07:
    - custom:
        blocks:
          - type: interactive
            interactive:
              type: list
              #header:
              #  type: text
              #  text: "Consulta Trámites"
              body:
                text: |
                  Haz seleccionado *Inspección Técnica de Seguridad en edificaciones previa al inicio de actividades para establecimientos objeto de inspección clasificados con Nivel de Riesgo Muy Alto*

                  *🟢 Opciones de pregunta:*  

                  1️. 📘¿Qué es?  

                  2️. 📝¿Qué necesito?  

                  3️. 💰¿Cuánto cuesta el derecho de trámite?

              footer:
                text: "*Seleccione la pregunta abajo 👇*"

              action:
                sections:
                  - title: "Escoge la pregunta"
                    rows:
                      - id: "/gestion_item07_consulta"
                        title: "📘 ¿Qué es?"
                      - id: "/gestion_item07_necesidad"
                        title: "📝 ¿Qué necesito?"
                      - id: "/gestion_item07_costo"
                        title: "💰 ¿Cuánto cuesta?"
                button: "Opciones"

  # >> 2.7... CONSULTA
  utter_gestion_item07_consulta:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                🏢 Es una evaluación técnica de seguridad realizada antes de que un establecimiento con nivel de riesgo muy alto comience sus actividades.

                *¿Para qué es necesario?*

                ✅ Garantiza que el establecimiento cumpla con todas las normativas de seguridad críticas para minimizar riesgos y proteger a los ocupantes y visitantes.

  # >> 2.7... NECESIDAD
  utter_gestion_item07_necesidad:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: true
              body: |
                a. 🖋️ Declaración jurada de cumplimiento de Seguridad en Edificaciones.
                  
                  http://sut.pcm.gob.pe/sutArchivos/file_1487_20230418_112413.pdf

                b. 📑 Solicitud de inspección técnica de seguridad en edificaciones (ITSE) y de evaluación de condiciones de seguridad en espectáculos públicos deportivos y no deportivos (ECSE) (Anexo 1)  
                  👉 https://web.munisjl.gob.pe/web/pdf/rdesastres/ANEXO01.pdf

                c. 📋 Información proporcionada por el solicitante para la determinación del nivel de riesgo del establecimiento objeto de inspección (Anexo 2)  
                  👉 https://web.munisjl.gob.pe/web/pdf/rdesastres/ANEXO02.pdf

                d. 📊 Reporte del nivel de riesgo del establecimiento objeto de inspección (Anexo 3)  
                  👉 https://web.munisjl.gob.pe/web/pdf/rdesastres/ANEXO03.pdf

          - type: text
            text:
              preview_url: false
              body: |
                📄 Documentos técnicos en copia simple:
                1. 📋 Copia de licencia
                2. 🪪 Copia DNI- Vigencia de poder
                3. 🧾 Comprobante de pago por derecho de trámite
                4. 🗺️ Plano de ubicación y cuadro de áreas, con firma Arq.
                5. 📐 Plano de Arquitectura de la distribución existente con cotas y detalle del cálculo de aforo con firma Arq.
                6. 🚪 Plano de señalización y Evacuación con firma Arq.
                7. 🏢 Plano de seguridad del establecimiento objeto de inspección
                8. ⚡ Plano de distribución de tableros eléctricos, diagramas unifilares y cuadro de carga con firma del Ing. Eléctrico o Mecánico Electricista
                9. 🔌 Certificado vigente de medición del sistema de puesta a tierra
                10. 💡 Certificado de luces de emergencia, con firma del Ing. Eléctrico o Mecánico electricista
                11. 🔔 Certificado de detector de humo centralizado, con firma del Ing. Eléctrico o Mecánico electricista
                12. 🧯 Certificado de operatividad y mantenimiento de extintores
                13. 👨‍🏫 Certificado de capacitación de uso y manejo de extintores, primeros auxilios y evacuaciones
                14. 📊 Memoria o protocolos de pruebas operativas y/o mantenimiento de los equipos de seguridad y protección contra incendios (Gabinete contra incendio, rociadores, etc.)
                15. 📝 En caso de tercero carta poder y copia de DNI


  # >> 2.7... COSTO
  utter_gestion_item07_costo:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                💰 S/ 703.40
