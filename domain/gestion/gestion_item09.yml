version: "3.1"

intents:
  - gestion_item09_consulta
  - gestion_item09_necesidad
  - gestion_item09_costo

responses:

  # >> 2.9. EVALUACIÓN CONDICIONES DE SEGURIDAD
  utter_gestion_item09:
  - custom:
      blocks:
        - type: interactive
          interactive:
            type: list
            #header:
            #  type: text
            #  text: "Consulta Trámites"
            body:
              text: |
                Haz seleccionado *Evaluación de Condiciones de Seguridad en espectáculos públicos deportivos y no deportivos (ECSE) con una concurrencia de hasta 3,000 personas*

                *🟢 Opciones de pregunta:*  

                1️. 📘¿Qué es?  

                2️. 📝¿Qué necesito?  

                3️. 💰¿Cuánto cuesta el derecho de trámite?  

            footer:
              text: "*Seleccione la pregunta abajo 👇*"

            action:
              sections:
                - title: "Escoge la pregunta"
                  rows:
                    - id: "/gestion_item09_consulta"
                      title: "Pregunta 1"
                      description: "📘 ¿Qué es?"
                    - id: "/gestion_item09_necesidad"
                      title: "Pregunta 2"
                      description: "📝 ¿Qué necesito?"
                    - id: "/gestion_item09_costo"
                      title: "Pregunta 3"
                      description: "💰 ¿Cuánto cuesta?"
              button: "Opciones"

  # >> 2.9... CONSULTA
  utter_gestion_item09_consulta:
  - custom:
      blocks:
        - type: text
          text:
            preview_url: false
            body: |
                🛑 Evaluación de las condiciones de seguridad para eventos públicos, deportivos y no deportivos, con una asistencia de hasta 3,000 personas.

                *¿Para qué es necesario?*

                ✅ Asegura que el evento cumpla con las normativas de seguridad necesarias para proteger a los asistentes y gestionar riesgos durante la realización del evento.

  # >> 2.9... NECESIDAD
  utter_gestion_item09_necesidad:
  - custom:
      blocks:
        - type: text
          text:
            preview_url: false
            body: |
                1. 📝 Solicitud de renovación ITSE, indicando número y fecha de pago.
                
                2. 🖋️ Declaración jurada del solicitante, incluyendo datos del representante legal si aplica.

                3. 📍 Croquis del lugar donde se realizará el espectáculo.

                4. 🗺️ Plano del espacio con distribución del escenario y aforo.

                5. 📋 Descripción del evento, montaje, instalaciones eléctricas, y seguridad.

                6. ⚡ Protocolo de medición del sistema de puesta a tierra (si hay instalaciones eléctricas).

                7. 🔥 Constancia de mantenimiento de extintores.

                8. 🚪 Plan de seguridad con señalización, rutas de evacuación, y zonas seguras.

                9. 🏭 Declaración de instalación segura de gas licuado (si aplica).

                10. 🎢 Memoria descriptiva de seguridad para juegos mecánicos (si se usan).

                11. 🏛️ Certificado de inspección técnica de seguridad (ITSE) si el recinto no lo ha emitido la Municipalidad.

  # >> 2.9... COSTO
  utter_gestion_item09_costo:
  - custom:
      blocks:
        - type: text
          text:
            preview_url: false
            body: |
                💰 S/ 356.30
