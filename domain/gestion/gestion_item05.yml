version: "3.1"

intents:
  - gestion_item05_consulta
  - gestion_item05_necesidad
  - gestion_item05_costo

responses:

  # >> 2.5. INSPECCIÓN RIESGO ALTO
  utter_gestion_item05:
  - custom:
      blocks:
        - type: interactive
          interactive:
            type: list
            #header:
            #  type: text
            #  text: "Consulta Trámites"
            body:
              text: |
                Haz seleccionado *Inspección Técnica de Seguridad en edificaciones previa al inicio de actividades para establecimientos objeto de inspección clasificados con Nivel de Riesgo Alto*

                *🟢 Opciones de pregunta:*  

                1️. 📘¿Qué es?  

                2️. 📝¿Qué necesito?  

                3️. 💰¿Cuánto cuesta el derecho de trámite?  

            footer:
              text: "*Seleccione la pregunta abajo 👇*"

            action:
              sections:
                - title: "Escoge la pregunta"
                  rows:
                    - id: "/gestion_item05_consulta"
                      title: "Pregunta 1"
                      description: "📘 ¿Qué es?"
                    - id: "/gestion_item05_necesidad"
                      title: "Pregunta 2"
                      description: "📝 ¿Qué necesito?"
                    - id: "/gestion_item05_costo"
                      title: "Pregunta 3"
                      description: "💰 ¿Cuánto cuesta?"
              button: "Opciones"

  # >> 2.5... CONSULTA
  utter_gestion_item05_consulta:
  - custom:
      blocks:
        - type: text
          text:
            preview_url: false
            body: |
                🏢 Evaluación de seguridad previa al inicio de actividades en establecimientos con alto riesgo.

                *¿Para qué sirve?*

                ✅ Asegura que el establecimiento cumpla con las normativas de seguridad antes de comenzar operaciones.

  # >> 2.5... NECESIDAD
  utter_gestion_item05_necesidad:
  - custom:
      blocks:
        - type: text
          text:
            preview_url: true
            body: |
                📝 Solicitud de renovación ITSE, indicando número y fecha de pago.
                
                http://sut.pcm.gob.pe/sutArchivos/file_1487_20230418_112532.pdf

        - type: text
          text:
            preview_url: false
            body: |
                🗂️ Documentos técnicos en copia simple:

                1. 🗺️ Croquis de ubicación

                2. 📐 Plano de arquitectura y detalle de aforo

                3. ⚡ Plano de distribución eléctrica y cargas

                4. ✅ Certificado vigente de puesta a tierra

                5. 🛡️ Plan de seguridad del establecimiento

                6. 🔥 Memoria de prueba de mantenimiento de equipos y protección contra incendios

  # >> 2.5... COSTO
  utter_gestion_item05_costo:
