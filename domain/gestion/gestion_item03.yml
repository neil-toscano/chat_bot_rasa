version: "3.1"

intents:
  - gestion_item03_consulta
  - gestion_item03_necesidad
  - gestion_item03_costo

responses:
  # >> 2.3. INSPECCIÓN RIESGO MEDIO
  utter_gestion_item03:
    - custom:
        blocks:
          - type: interactive
            interactive:
              type: list
              # header:
              #   type: text
              #   text: "🟢 Consulta Trámites"
              body:
                text: |
                  Haz seleccionado *📋 Inspección Técnica de Seguridad en edificaciones posterior al inicio de actividades para establecimientos objeto de inspección clasificados con Nivel de Riesgo Medio*  

                  *🟢 Opciones de pregunta:*  

                  1️. 📘¿Qué es?  

                  2️. 📝¿Qué necesito?  

                  3️. 💰¿Cuánto cuesta el derecho de trámite?

              footer:
                text: "*Seleccione la pregunta abajo 👇*"

              action:
                sections:
                  - title: "Escoge la pregunta"
                    rows:
                      - id: "/gestion_item03_consulta"
                        title: "📘 ¿Qué es?"
                      - id: "/gestion_item03_necesidad"
                        title: "📋 ¿Qué necesito?"
                      - id: "/gestion_item03_costo"
                        title: "💰 ¿Cuánto cuesta?"
                button: "Selecciona pregunta"

  # >> 2.3... CONSULTA
  utter_gestion_item03_consulta:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                📘 Es una inspección técnica de seguridad que se realiza en establecimientos con riesgo medio después de que han comenzado sus actividades.  

                *¿Para qué es necesario?*  

                📋 Para garantizar que el establecimiento cumpla con las normativas de seguridad y proporciona un entorno seguro para los ocupantes y visitantes.

  # >> 2.3... NECESIDAD
  utter_gestion_item03_necesidad:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: true
              body: |
                a. 📄🛠️ Solicitud de inspección técnica de seguridad en edificaciones (ITSE) y de evaluación de condiciones de seguridad en espectáculos públicos deportivos y no deportivos (ECSE) (Anexo 1)  
                  👉https://web.munisjl.gob.pe/web/pdf/rdesastres/ANEXO01.pdf

                b. 📄📊 Información proporcionada por el solicitante para la determinación del nivel de riesgo del establecimiento objeto de inspección (Anexo 2)  
                  👉https://web.munisjl.gob.pe/web/pdf/rdesastres/ANEXO02.pdf

                c. 📄📉 Reporte del nivel de riesgo del establecimiento objeto de inspección (Anexo 3)  
                  👉https://web.munisjl.gob.pe/web/pdf/rdesastres/ANEXO03.pdf
                    
                d. 📄✅ Declaración jurada del cumplimiento de las condiciones de seguridad en la edificación (Anexo 4)  
                  👉https://web.munisjl.gob.pe/web/pdf/rdesastres/ANEXO04.pdf


  # >> 2.3... COSTO
  utter_gestion_item03_costo:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                💰 S/ 166.70
