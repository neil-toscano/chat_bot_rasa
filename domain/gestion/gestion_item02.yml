version: "3.1"

intents:
  - gestion_item02_consulta
  - gestion_item02_necesidad
  - gestion_item02_costo

responses:
  # >> 2.2. RENOVACIÓN RIESGO BAJO
  utter_gestion_item02:
    - custom:
        blocks:
          - type: interactive
            interactive:
              type: list
              #header:
              #  type: text
              #  text: "Consulta Trámites"
              body:
                text: |
                  Haz seleccionado *📋 Renovación del Certificado de Inspección Técnica de Seguridad en edificaciones para establecimientos objeto de inspección clasificados con Nivel de Riesgo Bajo*  

                  *🟢 Opciones de pregunta:*  

                  1️. 📘¿Qué es?

                  2️. 📝¿Qué necesito?

                  3️. 💰¿Cuánto cuesta el derecho de trámite?

              footer:
                text: "*Seleccione la pregunta abajo 👇*"

              action:
                sections:
                  - title: "Escoge la pregunta"
                    rows:
                      - id: "/gestion_item02_consulta"
                        title: "📘 ¿Qué es?"
                      - id: "/gestion_item02_necesidad"
                        title: "📋 ¿Qué necesito?"
                      - id: "/gestion_item02_costo"
                        title: "💰 ¿Cuánto cuesta?"
                button: "Selecciona pregunta"

  # >> 2.2... CONSULTA
  utter_gestion_item02_consulta:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                📘 Es el proceso para actualizar el certificado de inspección técnica de seguridad en edificaciones para establecimientos con un nivel de riesgo bajo.  

                *¿Para qué es necesario?*  

                📋 Asegurar que el establecimiento continúa cumpliendo con las normativas de seguridad y mantiene un entorno seguro para ocupantes y visitantes.

  # >> 2.2... NECESIDAD
  utter_gestion_item02_necesidad:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: true
              body: |
                a. 📑 Declaración jurada de cumplimiento de Seguridad en Edificaciones  
                  http://sut.pcm.gob.pe/sutArchivos/file_1487_20230418_112413.pdf

                b. 📋 Solicitud de inspección técnica de seguridad en edificaciones (ITSE) y de evaluación de condiciones de seguridad en espectáculos públicos deportivos y no deportivos (ECSE) (Anexo 1)  
                  http://sut.pcm.gob.pe/sutArchivos/file_1487_20230418_112532.pdf

          - type: text
            text:
              preview_url: true
              body: |
                c. 📝 Declaración jurada para renovación del certificado de inspección técnica de seguridad en edificaciones (Anexo 5)  
                  https://citasbackend.munisjl.gob.pe/api/files/pdf/7da95186-07da-42c4-a3ae-ba68cdf999e5.pdf

                d. 📄 Copia de licencia de funcionamiento  
                e. 🏢 Copia del certificado ITSE vigente  
                f. 🆔 En caso de ser persona jurídica, traer:  
                  - DNI físicamente  
                  - Vigencia de poder  
                  - Plano de ubicación  

  # >> 2.2... COSTO
  utter_gestion_item02_costo:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                💰 S/ 136.40
