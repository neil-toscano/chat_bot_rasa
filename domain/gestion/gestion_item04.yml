version: "3.1"

intents:
  - gestion_item04_consulta
  - gestion_item04_necesidad
  - gestion_item04_costo

responses:
  # >> 2.4. RENOVACIÓN RIESGO MEDIO
  utter_gestion_item04:
    - custom:
        blocks:
          - type: interactive
            interactive:
              type: list
              #header:
              #  type: text
              #  text: "Consulta Trámites"
              body:
                text: |
                  Haz seleccionado *📋 Renovación del Certificado de Inspección Técnica de Seguridad en edificaciones para establecimientos objeto de inspección clasificados con Nivel De Riesgo Medio*  

                  *🟢 Opciones de pregunta:*  

                  1️. 📘¿Qué es?  

                  2️. 📝¿Qué necesito?  

                  3️. 💰¿Cuánto cuesta el derecho de trámite?

              footer:
                text: "*Seleccione la pregunta abajo 👇*"

              action:
                sections:
                  - title: "Escoge la pregunta"
                    rows:
                      - id: "/gestion_item04_consulta"
                        title: "📘 ¿Qué es?"
                      - id: "/gestion_item04_necesidad"
                        title: "📋 ¿Qué necesito?"
                      - id: "/gestion_item04_costo"
                        title: "💰 ¿Cuánto cuesta?"
                button: "Selecciona pregunta"

  # >> 2.4... CONSULTA
  utter_gestion_item04_consulta:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                📘 Es el proceso para actualizar el certificado de inspección técnica de seguridad en edificaciones para establecimientos con un nivel de riesgo medio.  

                *¿Para qué es necesario?*  

                📋 Asegurar que el establecimiento continúa cumpliendo con las normativas de seguridad y mantiene un entorno seguro para ocupantes y visitantes.

  # >> 2.4... NECESIDAD
  utter_gestion_item04_necesidad:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: true
              body: |
                a. 📄Solicitud de inspección técnica de seguridad en edificaciones (ITSE) y de evaluación de condiciones de seguridad en espectáculos públicos deportivos y no deportivos (ECSE) (Anexo 1)  
                  👉https://web.munisjl.gob.pe/web/pdf/rdesastres/ANEXO01.pdf

                b. 📄Información proporcionada por el solicitante para la determinación del nivel de riesgo del establecimiento objeto de inspección (Anexo 2)  
                  👉https://web.munisjl.gob.pe/web/pdf/rdesastres/ANEXO02.pdf

          - type: text
            text:
              preview_url: true
              body: |
                c. 📄Reporte del nivel de riesgo del establecimiento objeto de inspección (Anexo 3)  
                  👉https://web.munisjl.gob.pe/web/pdf/rdesastres/ANEXO03.pdf
                    
                d. 📄Declaración jurada del cumplimiento de las condiciones de seguridad en la edificación (Anexo 4)  
                  👉https://web.munisjl.gob.pe/web/pdf/rdesastres/ANEXO04.pdf
                    
                e. 🏢Copia de licencia de funcionamiento
                f. ✅Copia del certificado ITSE vigente
                g. 🆔En caso de persona jurídica traer DNI físicamente, vigencia de poder y plano de ubicación


  # >> 2.4... COSTO
  utter_gestion_item04_costo:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                💰 S/ 155.60
