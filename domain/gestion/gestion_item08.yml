version: "3.1"

intents:
  - gestion_item08_consulta
  - gestion_item08_necesidad
  - gestion_item08_costo

responses:
  # >> 2.8. RENOVACIÓN RIESGO MUY ALTO
  utter_gestion_item08:
    - custom:
        blocks:
          - type: interactive
            interactive:
              type: list
              #header:
              #  type: text
              #  text: "Consulta Trámites"
              body:
                text: |
                  Haz seleccionado *Renovación del Certificado de Inspección Técnica de Seguridad en edificaciones para establecimientos objeto de inspección clasificados con Nivel de Riesgo Muy Alto*

                  *🟢 Opciones de pregunta:*  

                  1️. 📘¿Qué es?  

                  2️. 📝¿Qué necesito?  

                  3️. 💰¿Cuánto cuesta el derecho de trámite?

              footer:
                text: "*Seleccione la pregunta abajo 👇*"

              action:
                sections:
                  - title: "Escoge la pregunta"
                    rows:
                      - id: "/gestion_item08_consulta"
                        title: "📘 ¿Qué es?"
                      - id: "/gestion_item08_necesidad"
                        title: "📝 ¿Qué necesito?"
                      - id: "/gestion_item08_costo"
                        title: "💰 ¿Cuánto cuesta?"
                button: "Opciones"

  # >> 2.8... CONSULTA
  utter_gestion_item08_consulta:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                🏢 Es el proceso de actualización del certificado que verifica la seguridad en edificaciones con nivel de riesgo muy alto.

                *¿Para qué es necesario?*

                ✅ Asegura que el establecimiento sigue cumpliendo con las normativas de seguridad y mantiene un entorno seguro, renovando la validez del certificado previamente emitido.

  # >> 2.8... NECESIDAD
  utter_gestion_item08_necesidad:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: true
              body: |
                a. 📄 Copia de licencia de funcionamiento
                b. 📋 Copia de certificado ITSE vigente
                c. 🏢 En caso de persona jurídica:
                   • 📌 DNI físicamente
                   • 📎 Vigencia de poder
                   • 🗺️ Plano de ubicación

                d. 📑 Solicitud de inspección técnica de seguridad en edificaciones (ITSE) y de evaluación de condiciones de seguridad en espectáculos públicos deportivos y no deportivos (ECSE) (anexo 1)
                    👉 https://web.munisjl.gob.pe/web/pdf/rdesastres/ANEXO01.pdf

                e. 📄 Declaración jurada para renovación del certificado de inspección técnica de seguridad en edificaciones (anexo 5)
                    👉 https://cdn.www.gob.pe/uploads/document/file/6084753/5384902-anexo-5-declaracion-jurada-para-la-renovacion-del-certificado-de-inspeccion-tecnica-de-seguridad-de-edificaciones.pdf
                

  # >> 2.8... COSTO
  utter_gestion_item08_costo:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                💰 S/ 707.20
