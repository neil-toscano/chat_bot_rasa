version: "3.1"

intents:
  - formalizacion_item04_edificacion_riesgo_muy_alto
  - formalizacion_item04_riesgo_muy_alto_que_es
  - formalizacion_item04_riesgo_muy_alto_que_necesito
  - formalizacion_item04_servicio_de_salud
  - formalizacion_item04_actividad_requiere_autorizacion
  - formalizacion_item04_monumento_del_patrimonio_cultural
  - formalizacion_item04_riesgo_muy_alto_cuanto_cuesta

responses:
  # ===========4.1====================
  utter_formalizacion_item04_edificacion_riesgo_muy_alto:
    - custom:
        blocks:
          - type: interactive
            interactive:
              type: list
              body:
                text: |
                  *🎉 Has seleccionado licencia de funcionamiento de edificación de riesgo muy alto*

                  *❓ Opciones de pregunta:*

                  1️. 📘¿Qué es?

                  2️. 📝¿Qué necesito?

                  3️. 💰¿Cuánto cuesta el derecho de trámite?
              footer:
                text: "*Seleccione la pregunta abajo 👇*"

              action:
                sections:
                  - title: "Escoja la pregunta"
                    rows:
                      - id: "/formalizacion_item04_riesgo_muy_alto_que_es"
                        title: "¿Qué es? 📘"
                      - id: "/formalizacion_item04_riesgo_muy_alto_que_necesito"
                        title: "¿Qué necesito? 📝"
                      - id: "/formalizacion_item04_riesgo_muy_alto_cuanto_cuesta"
                        title: "¿Cuánto cuesta? 💰"
                button: "Opciones"

  # ==========4.2=======================

  utter_formalizacion_item04_riesgo_muy_alto_que_es:
    - custom:
        blocks:
          - type: "text"
            text:
              preview_url: false
              body: |
                📄Es un permiso otorgado por la municipalidad para que un negocio opere en un local que ha sido clasificado como de riesgo muy alto

  utter_formalizacion_item04_riesgo_muy_alto_que_necesito:
    - custom:
        blocks:
          - type: "text"
            text:
              preview_url: true
              body: |
                a. 📄Formato de declaración jurada para licencia de funcionamiento. https://www.bn.com.pe/nosotros/archivos/manual-procesos-bn.pdf

          - type: "text"
            text:
              preview_url: true
              body: |
                b. 📄Declaración jurada de representante legal, en el caso de personas jurídicas, copia literal de la vigencia de poder actualizada

          - type: "text"
            text:
              preview_url: false
              body: |
                c. 📄 Declaración jurada de seguridad
                d. 🗺️ Croquis de ubicación	
                e. 🏛️ Plano de arquitectura y cálculo de aforo
                f. ⚡ Planos eléctricos, unifilares y cargas
                g. 📜 Certificado del sistema puesto a tierra
                h. 🔥 Memoria de operatividad y mantenimiento, y certificado contra incendios
                i. 🛡️ Plan de seguridad del establecimiento

          - type: interactive
            interactive:
              type: list
              body:
                text: |
                  *Requisitos especiales* solo para ciertas actividades

                  *❓ ¿Para qué actividades son estos requisitos?*

                  1️. 🏥Servicios de salud

                  2️. 📜Actividades que requieren autorización

                  3️. 🏛️Monumento del Patrimonio Cultural

              footer:
                text: "*Seleccione la actividad abajo 👇*"

              action:
                sections:
                  - title: "Seleccione actividad"
                    rows:
                      - id: "/formalizacion_item04_servicio_de_salud"
                        title: "Salud"
                      - id: "/formalizacion_item04_actividad_requiere_autorizacion"
                        title: "Autorización"
                      - id: "/formalizacion_item04_monumento_del_patrimonio_cultural"
                        title: "Patrimonio cultural"
                button: "Seleccione actividad"

  utter_formalizacion_item04_servicio_de_salud:
    - custom:
        blocks:
          - type: "text"
            text:
              preview_url: false
              body: |
                Se necesita tener título y colegiatura vigente

  utter_formalizacion_item04_actividad_requiere_autorizacion:
    - custom:
        blocks:
          - type: "text"
            text:
              preview_url: false
              body: |
                Se necesita tener declaración jurada de la autorización

  utter_formalizacion_item04_monumento_del_patrimonio_cultural:
    - custom:
        blocks:
          - type: "text"
            text:
              preview_url: false
              body: |
                Se necesita tener copia de autorización del Ministerio de Cultura

  utter_formalizacion_item04_riesgo_muy_alto_cuanto_cuesta:
    - custom:
        blocks:
          - type: "text"
            text:
              preview_url: false
              body: |
                💵 S/ 780.40

# =============================================
