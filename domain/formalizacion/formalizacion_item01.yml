version: "3.1"

intents:
  - licencia_funcionamiento_edificacion_riesgo_bajo_que_es
  - licencia_funcionamiento_edificacion_riesgo_bajo_que_necesito
  - servicio_de_salud
  - actividad_requiere_autorizacion
  - monumento_del_patrimonio_cultural
  - licencia_funcionamiento_edificacion_riesgo_bajo_cuanto_cuesta

responses:
  # ===========**====================
  utter_licencia_funcionamiento_edificacion_riesgo_bajo:
    - custom:
        blocks:
          - type: interactive
            interactive:
              type: list
              # header:
              #   type: text
              #   text: "Consulta Trámites"
              body:
                text: |
                  *🎉 Haz seleccionado licencia de funcionamiento de edificación de riesgo bajo*

                  *❓ Opciones de pregunta:*

                  1️. 📘¿Qué es?

                  2️. 📝¿Qué necesito?

                  3️. 💰¿Cuánto cuesta el derecho de trámite?
              footer:
                text: "*Seleccione la pregunta abajo 👇*"

              action:
                sections:
                  - title: "Escoja la pregunta"
                    rows:
                      - id: "/licencia_funcionamiento_edificacion_riesgo_bajo_que_es"
                        title: "¿Qué es? 📘"
                      - id: "/licencia_funcionamiento_edificacion_riesgo_bajo_que_necesito"
                        title: "¿Qué necesito? 📝"
                      - id: "/licencia_funcionamiento_edificacion_riesgo_bajo_cuanto_cuesta"
                        title: "¿Cuánto cuesta? 💰"
                button: "Opciones"

  # ==========***=======================

  utter_licencia_funcionamiento_edificacion_riesgo_bajo_que_es:
    - custom:
        blocks:
          - type: "text"
            text:
              preview_url: false
              body: |
                📄Es un permiso otorgado por la municipalidad para que un negocio inicie su actividad comercial  en un local que ha sido clasificado como de riesgo bajo

  utter_licencia_funcionamiento_edificacion_riesgo_bajo_que_necesito:
    - custom:
        blocks:
          - type: "text"
            text:
              preview_url: true
              body: |
                a. 📄Formato de declaración jurada para licencia de funcionamiento.

          - type: "text"
            text:
              preview_url: true
              body: |
                b. 📄Declaración jurada de cumplimiento de las condiciones de seguridad en la edificación.

          - type: "text"
            text:
              preview_url: true
              body: |
                c. 📄Declaración jurada de representante legal, en el caso de personas jurídicas, Copia literal de la vigencia de poder actualizada

          - type: interactive
            interactive:
              type: list
              # header:
              #   type: text
              #   text: "Consulta Trámites"
              body:
                text: |
                  *Requisitos especiales* solo para ciertas actividades

                  *❓ ¿Para qué actividades son estos requisitos?*

                  1️. 🏥Servicios de salud

                  2️. 📜Actividades que requieren autorización

                  3️. 🏛️Monumento del Patrimonio Cultural

              footer:
                text: "*Seleccione la actividad abajo 👇*"

              action:
                sections:
                  - title: "Seleccione actividad"
                    rows:
                      - id: "/servicio_de_salud"
                        title: "Salud"
                      - id: "/actividad_requiere_autorizacion"
                        title: "Autorización"
                      - id: "/monumento_del_patrimonio_cultural"
                        title: "Patrimonio cultural"
                button: "Seleccione actividad"
  utter_servicio_de_salud:
    - custom:
        blocks:
          - type: "text"
            text:
              preview_url: false
              body: |
                Se necesita tener título y colegiatura vigente

  utter_actividad_requiere_autorizacion:
    - custom:
        blocks:
          - type: "text"
            text:
              preview_url: false
              body: |
                Se necesita tener declaración jurada de la autorización

  utter_monumento_del_patrimonio_cultural:
    - custom:
        blocks:
          - type: "text"
            text:
              preview_url: false
              body: |
                Se necesita tener copia de autorización del Ministerio de Cultura

  utter_licencia_funcionamiento_edificacion_riesgo_bajo_cuanto_cuesta:
    - custom:
        blocks:
          - type: "text"
            text:
              preview_url: false
              body: |
                💵 S/ 236.60

# =============================================
