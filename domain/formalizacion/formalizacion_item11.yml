                b. 📅 Formato de declaración jurada para licencia de funcionamiento
                https://web.munisjl.gob.pe/web/pdf/lfuncionamiento/formato_declaracion-jurada.pdf


  utter_formalizacion_item11_cese_licencia_cuanto_cuesta:
