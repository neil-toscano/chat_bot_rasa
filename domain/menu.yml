version: "3.1"

intents:
  - saludo
  - despedida
  - afirmacion
  - reto_bot
  - negacion
  - animo_bien
  - animo_mal
  - formalizacion
  - gestion
  - orientacion
  - registro
  - obras
  - seleccionar_opcion
  - pregunta_consulta
  - pregunta_necesidad
  - pregunta_costo

slots:
  opcion:
    type: categorical
    influence_conversation: false
    mappings:
      - type: from_intent
        intent: seleccionar_opcion
        value: "formalizacion_item01"
      - type: from_intent
        intent: seleccionar_opcion
        value: "gestion_item01"
      - type: from_intent
        intent: seleccionar_opcion
        value: "orientacion_item01"
      - type: from_intent
        intent: seleccionar_opcion
        value: "registro_item01"
      - type: from_intent
        intent: seleccionar_opcion
        value: "obras_item01"

responses:

  # >> MENÚ PRINCIPAL :
  utter_saludo:
   - text: "¡Hola! Soy el asistente virtual de la MUNICIPALIDAD DISTRITAL SAN JUAN DE LURIGANCHO. ¿Sobre qué área te gustaría obtener información? Por favor, elige una de las siguientes opciones:"
     buttons:
     - title: "FORMALIZACIÓN Y PROMOCIÓN EMPRESARIAL"
       payload: "/formalizacion"
     - title: "GESTIÓN DEL RIESGO DE DESASTRES"
       payload: "/gestion"
     - title: "ORIENTACIÓN Y REGISTRO"
       payload: "/orientacion"
     - title: "REGISTRO CIVIL"
       payload: "/registro"
     - title: "OBRAS PRIVADAS Y HABILITACIÓN URBANA"
       payload: "/obras"

  # >> PREGUNTAS DEFINIDAS :
  utter_opciones_preguntas:
    - text: "Has seleccionado {opcion}. ¿En qué puedo ayudarte?"
      buttons:
        - title: "¿Qué es?"
          payload: "/pregunta_consulta"
        - title: "¿Qué necesito?"
          payload: "/pregunta_necesidad"
        - title: "¿Cuánto cuesta el derecho de trámite?"
          payload: "/pregunta_costo"
  
  # >> RESPUESTAS GENÉRICAS :
  utter_respuesta_consulta:
    - text: "{opcion}: {consulta}"

  utter_respuesta_necesidad:
    - text: "{opcion}: {necesidad}"

  utter_respuesta_costo:
    - text: "{opcion}: {costo}"

  utter_animo:
  - text: "Siento escuchar eso, aquí hay algo que te va dar ánimo"
    image: "https://i.imgur.com/nGF1K8f.jpg"

  utter_sirvio_de_ayuda:
  - text: "¿Te ha ayudado?"

  utter_feliz:
  - text: "Genial, continua así"

  utter_despedida:
  - text: "Hasta luego"

  utter_soy_bot:
  - text: "Soy un bot, entrenado por la Municipalidad de San Juan de Lurigancho."

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
