version: "3.1"

intents:
  - certificado_prenupcial_que_es
  - certificado_prenupcial_que_necesito
  - certificado_prenupcial_cuanto_cuesta

responses:
  # >> 8.2. CERTIFICADO PRENUPCIAL
  utter_certificado_prenupcial:
    - custom:
        blocks:
          - type: interactive
            interactive:
              type: list
              body:
                text: |
                  *🎉 Has seleccionado Certificado Prenupcial*

                  *❓ Opciones de pregunta:*

                  1. 📄¿Qué es?

                  2. 📋¿Requisitos?

                  3. 💵¿Cuánto cuesta el derecho de trámite?
              footer:
                text: "*Seleccione la opción abajo 👇*"

              action:
                sections:
                  - title: "Escoge la opción"
                    rows:
                      - id: "/certificado_prenupcial_que_es"
                        title: "¿Qué es? 📄"
                      - id: "/certificado_prenupcial_que_necesito"
                        title: "¿Requisitos? 📋"
                      - id: "/certificado_prenupcial_cuanto_cuesta"
                        title: "¿Cuánto cuesta? 💵"
                button: "✅ Opciones"

  # >> 8.2... CONSULTA
  utter_certificado_prenupcial_que_es:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                📜 Es un documento oficial requerido por las parejas antes de contraer matrimonio. Certifica que ambos contrayentes cumplen con las evaluaciones médicas necesarias.

  # >> 8.2... NECESIDAD
  utter_certificado_prenupcial_que_necesito:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                *Requisitos para el trámite:*

                1. 💰 Pago por derecho de servicio: S/. 50.00 por persona

                2. 🆔 Exhibir DNI de los contrayentes

  # >> 8.2... COSTO
  utter_certificado_prenupcial_cuanto_cuesta:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                💰 *Costo del trámite:* S/. 50.00 por persona

                *Duración:* 1 día
