  # >> 1. FORMALIZACIÓN Y PROMOCIÓN EMPRESARIAL :
  utter_formalizacion_promocion_empresarial:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                *Formalización y promoción empresarial*
                1. 🟢Licencia de funcionamiento para edificaciones calificadas con nivel de riesgo bajo
                      _(con ITSE posterior)_

                2. 🟡Licencia de funcionamiento para edificaciones calificadas con nivel de riesgo medio
                      _(con ITSE posterior)_

                3. 🔴Licencia de funcionamiento para edificaciones calificadas con nivel de riesgo alto
                      _(con ITSE previa)_

                4. ⚠️Licencia de funcionamiento para edificaciones calificadas con nivel de riesgo muy alto
                      _(con ITSE previa)_

                5. 🔄Transferencia de licencia de funcionamiento o cambio de denominación o nombre comercial de la persona jurídica

          - type: interactive
            interactive:
              type: list
              # header:
              #   type: text
              #   text: "Consulta Trámites"
