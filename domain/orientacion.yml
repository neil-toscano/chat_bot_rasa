version: "3.1"

intents:
  - orientacion
  - orientacion_item01
  - orientacion_item02
  - orientacion_item03
  - orientacion_item04

responses:
  # >> 3. INSCRIPCIÓN DE PREDIOS :
  utter_orientacion:
    - custom:
        blocks:
          - type: interactive
            interactive:
              type: list
              header:
                type: text
                text: "🟢 Opciones de Inscripción:"
              body:
                text: |
                  1. 📜 Inscripción por Sucesión Indivisa  

                  2. 🏠 Inscripción por Sucesión Intestada

                  3. 💼 Inscripción por Compra-Venta

                  4. 🗺️ Inscripción de una Independización o Subdivisión de Lotes

              footer:
                text: "*Seleccione la opción abajo 👇*"

              # >> LISTADO DE OPCIONES :
              action:
                sections:
                  - title: "Escoge el trámite"
                    rows:
                      - id: "/orientacion_item01"
                        title: "📜 SUCESIÓN INDIVISA"
                      - id: "/orientacion_item02"
                        title: "🏠 SUCESIÓN INTESTADA"
                      - id: "/orientacion_item03"
                        title: "💼 COMPRA-VENTA"
                      - id: "/orientacion_item04"
                        title: "🗺️ INDEPENDIZACIÓN"
                button: "Seleccionar Opción"
