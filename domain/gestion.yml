            text:
              preview_url: false
              body: |
                *🟢 Opciones de Trámite:*  

                1. 🏢 Inspección Técnica de Seguridad en edificaciones posterior al inicio de actividades para establecimientos objeto de inspección clasificados con **Nivel de Riesgo Bajo**  

                2. 🔄 Renovación del Certificado de Inspección Técnica de Seguridad en edificaciones para establecimientos objeto de inspección clasificados con **Nivel de Riesgo Bajo**  

                3. 🏢 Inspección Técnica de Seguridad en edificaciones posterior al inicio de actividades para establecimientos objeto de inspección clasificados con **Nivel de Riesgo Medio**  

                4. 🔄 Renovación del Certificado de Inspección Técnica de Seguridad en edificaciones para establecimientos objeto de inspección clasificados con **Nivel de Riesgo Medio**  

                5. 🏢 Inspección Técnica de Seguridad en edificaciones previa al inicio de actividades para establecimientos objeto de inspección clasificados con **Nivel de Riesgo Alto**

          - type: interactive
            interactive:
              type: list
              body:
                text: |
                  6. 🔄 Renovación del Certificado de Inspección Técnica de Seguridad en edificaciones para establecimientos objeto de inspección clasificados con **Nivel de Riesgo Alto**  

                  7. 🏢 Inspección Técnica de Seguridad en edificaciones previa al inicio de actividades para establecimientos objeto de inspección clasificados con **Nivel de Riesgo Muy Alto**  

                  8. 🔄 Renovación del Certificado de Inspección Técnica de Seguridad en edificaciones para establecimientos objeto de inspección clasificados con **Nivel de Riesgo Muy Alto**  

                  9. 🏟️ Evaluación de Condiciones de Seguridad en espectáculos públicos deportivos y no deportivos (ECSE) con una concurrencia de hasta **3,000 personas**  

                  10. 📄 Duplicado del Certificado de Inspección Técnica de Seguridad en edificaciones

              footer:
