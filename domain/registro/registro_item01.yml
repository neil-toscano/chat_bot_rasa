version: "3.1"

intents:
  - registro_item01_consulta
  - registro_item01_necesidad
  - registro_item01_costo

responses:
  # >> 4.1. MATRIMONIO CIVIL
  utter_registro_item01:
    - custom:
        blocks:
          - type: interactive
            interactive:
              type: list
              header:
                type: text
                text: "Consulta Trámites"
              body:
                text: |
                  Haz seleccionado *Matrimonio Civil*

                  *🟢 Opciones de pregunta:*

                  1. ¿Qué es?

                  2. ¿Qué necesito?

                  3. ¿Cuánto cuesta el derecho de trámite?
              footer:
                text: "**Seleccione la pregunta abajo**"

              action:
                sections:
                  - title: "Escoge la pregunta"
                    rows:
                      - id: "/registro_item01_consulta"
                        title: "Pregunta 1"
                        description: "¿Qué es?"
                      - id: "/registro_item01_necesidad"
                        title: "Pregunta 2"
                        description: "¿Qué necesito?"
                      - id: "/registro_item01_costo"
                        title: "Pregunta 3"
                        description: "¿Cuánto cuesta?"
                button: "Opciones"

  # >> 4.1... CONSULTA
  utter_registro_item01_consulta:
    - custom:
        blocks:
          - type: "text"
            text:
              preview_url: false
              body: |
                Este es el proceso administrativo mediante el cual una pareja solicita casarse en la Municipalidad, de acuerdo con lo que establece el Código Civil.

                *¿Para qué es necesario?*

                Esta unión otorga derechos y deberes legales a los cónyuges, como en temas de herencia, propiedad y protección legal, además de oficializar la relación ante el Estado y la sociedad.

  # >> 4.1... NECESIDAD
  utter_registro_item01_necesidad:
    - custom:
        blocks:
          - type: "text"
            text:
              preview_url: false
              body: |
                1. Solicitud simple o Formato de solicitud.

                2. Exhibición de los DNI de los contrayentes y testigos al abrir el expediente matrimonial.

                3. Copia certificada de Partida de nacimiento de los contrayentes.

                4. Declaración jurada de dos testigos que conozcan a los contrayentes, según el formato de la Municipalidad.

                5. Certificado médico pre-nupcial y constancia de charlas de Consejería, antiguedad no mayor a 30 días.

                6. Declaración Jurada de no tener impedimento para contraer matrimonio, de los contrayentes.

                7. Declaración jurada de domicilio (uno debe residir en el distrito).

                8. Indicar la fecha y número de constancia de pago.

  # >> 4.1... COSTO
  utter_registro_item01_costo:
    - custom:
        blocks:
          - type: "text"
            text:
              preview_url: false
              body: |
                1. En el local municipal - S/ 256.10

                2. Fuera del local municipal (dentro del distrito) - S/ 332.10

                3. Fuera del local municipal (fuera del distrito) - S/ 432.10
