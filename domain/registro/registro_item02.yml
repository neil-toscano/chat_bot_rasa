version: "3.1"

intents:
  - registro_item02_consulta
  - registro_item02_necesidad
  - registro_item02_costo

responses:
  # >> 4.2. PUBLICACIÓN DE EDICTO MATRIMONIAL
  utter_registro_item02:
    - custom:
        blocks:
          - type: interactive
            interactive:
              type: list
              #header:
              #  type: text
              #  text: "Consulta Trámites"
              body:
                text: |
                  Haz seleccionado *Publicación de Edicto Matrimonial tramitado en otros distritos*

                  *🟢 Opciones de pregunta:*  

                  1️. 📘¿Qué es?  

                  2️. 📝¿Qué necesito?  

                  3️. 💰¿Cuánto cuesta el derecho de trámite?

              footer:
                text: "*Seleccione la pregunta abajo 👇*"

              action:
                sections:
                  - title: "Escoge la pregunta"
                    rows:
                      - id: "/registro_item02_consulta"
                        title: "Opción 1"
                        description: "¿Qué es?"
                      - id: "/registro_item02_necesidad"
                        title: "Opción 2"
                        description: "¿Qué necesito?"
                      - id: "/registro_item02_costo"
                        title: "Opción 3"
                        description: "¿Cuánto cuesta?"
                button: "Opciones"

  # >> 4.2... CONSULTA
  utter_registro_item02_consulta:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                💍 Es la publicación de la celebración del matrimonio en un determinado distrito, cuando el domicilio de uno de los contrayentes es distinto al distrito en el cual se consigna el domicilio del DNI.

                *¿Para qué es necesario?*

                📢 Permite que cualquier ciudadano que conozca de la existencia de algún impedimento pueda denunciarlo.

  # >> 4.2... NECESIDAD
  utter_registro_item02_necesidad:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                1. 📝 Solicitud con carácter de Declaración Jurada.

                2. 📑 Copia simple del Edicto Matrimonial.

                3. 💵 Indicar fecha y número de constancia de pago.

  # >> 4.2... COSTO
  utter_registro_item02_costo:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                💰 S/ 44.80
