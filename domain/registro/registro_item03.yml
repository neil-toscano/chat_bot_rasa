version: "3.1"

intents:
  - registro_item03_consulta
  - registro_item03_necesidad
  - registro_item03_costo

responses:
  # >> 4.3. REPROGRAMACIÓN DE FECHA Y HORA 
  utter_registro_item03:
    - custom:
        blocks:
          - type: interactive
            interactive:
              type: list
              header:
                type: text
                text: "Consulta Trámites"
              body:
                text: |
                  Haz seleccionado *Reprogramación de fecha y hora de Ceremonia Matrimonial*

                  *🟢 Opciones de pregunta:*

                  1. ¿Qué es?

                  2. ¿Qué necesito?

                  3. ¿Cuánto cuesta el derecho de trámite?
              footer:
                text: "**Seleccione la pregunta abajo**"

              action:
                sections:
                  - title: "Escoge la pregunta"
                    rows:
                      - id: "/registro_item03_consulta"
                        title: "Pregunta 1"
                        description: "¿Qué es?"
                      - id: "/registro_item03_necesidad"
                        title: "Pregunta 2"
                        description: "¿Qué necesito?"
                      - id: "/registro_item03_costo"
                        title: "Pregunta 3"
                        description: "¿Cuánto cuesta?"
                button: "Opciones"

  # >> 4.3... CONSULTA
  utter_registro_item03_consulta:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                Servicio exclusivo mediante el cual los contrayentes pueden solicitar la postergación y/o reprogramación de la fecha de celebración del matrimonio.

  # >> 4.3... NECESIDAD
  utter_registro_item03_necesidad:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                1. Solicitud con carácter de Declaración Jurada.

                2. Indicar fecha y número de constancia de pago.

                3. El pedido se debe hacer con 5 días hábiles de anticipación.

  # >> 4.3... COSTO
  utter_registro_item03_costo:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                S/ 37.80
