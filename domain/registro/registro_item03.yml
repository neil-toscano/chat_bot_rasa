version: "3.1"

intents:
  - registro_item03_consulta
  - registro_item03_necesidad
  - registro_item03_costo

responses:
  # >> 4.3. REPROGRAMACIÓN DE FECHA Y HORA
  utter_registro_item03:
    - custom:
        blocks:
          - type: interactive
            interactive:
              type: list
              body:
                text: |
                  🔄 Has seleccionado *Reprogramación de fecha y hora de Ceremonia Matrimonial*

                  ❓ *Opciones de pregunta:*

                  1. 📄 ¿Qué es?  

                  2. 📋 ¿Qué necesito?  

                  3. 💵 ¿Cuánto cuesta el derecho de trámite?

              footer:
                text: "*Seleccione la pregunta abajo 👇*"

              action:
                sections:
                  - title: "Escoge la pregunta"
                    rows:
                      - id: "/registro_item03_consulta"
                        title: "📄 ¿Qué es?"
                      - id: "/registro_item03_necesidad"
                        title: "📋 ¿Qué necesito?"
                      - id: "/registro_item03_costo"
                        title: "💵 ¿Cuánto cuesta?"
                button: "✅ Opciones"

  # >> 4.3... CONSULTA
  utter_registro_item03_consulta:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                ⏳ Servicio exclusivo mediante el cual los contrayentes pueden solicitar la postergación y/o reprogramación de la fecha de celebración del matrimonio.

  # >> 4.3... NECESIDAD
  utter_registro_item03_necesidad:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: true
              body: |
                📋 Acto de Compromiso de los Contrayentes:

                🔗 https://web.munisjl.gob.pe/web/data_files/matrimonio/3m-acta-de-compromiso-de-los-contrayentes-vf.pdf

          - type: text
            text:
              preview_url: false
              body: |
                *📋 Requisitos adicionales:*

                1. 💵 Indicar fecha y número de constancia de pago.

                2. 📅 El pedido se debe hacer con 5 días hábiles de anticipación.

  # >> 4.3... COSTO
  utter_registro_item03_costo:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                *Costo del trámite* 👇
                
                💰 S/ 37.80
