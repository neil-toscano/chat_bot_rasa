version: "3.1"

intents:
  - registro_item04_consulta
  - registro_item04_necesidad
  - registro_item04_costo

responses:
  # >> 4.4. SEPARACIÓN Y DIVORCIO
  utter_registro_item04:
    - custom:
        blocks:
          - type: interactive
            interactive:
              type: list
              header:
                type: text
                text: "Consulta Trámites"
              body:
                text: |
                  Haz seleccionado *Separación Convencional y Divorcio Ulterior: Separación Convencional*

                  *🟢 Opciones de pregunta:*

                  1. ¿Qué es?

                  2. ¿Qué necesito?

                  3. ¿Cuánto cuesta el derecho de trámite?
              footer:
                text: "**Seleccione la pregunta abajo**"

              action:
                sections:
                  - title: "Escoge la pregunta"
                    rows:
                      - id: "/registro_item04_consulta"
                        title: "Pregunta 1"
                        description: "¿Qué es?"
                      - id: "/registro_item04_necesidad"
                        title: "Pregunta 2"
                        description: "¿Qué necesito?"
                      - id: "/registro_item04_costo"
                        title: "Pregunta 3"
                        description: "¿Cuánto cuesta?"
                button: "Opciones"

  # >> 4.4... CONSULTA
  utter_registro_item04_consulta:
    - custom:
        blocks:
          - type: "text"
            text:
              preview_url: false
              body: |
                Procedimiento mediante el cual ambos cónyuges manifiestan ante la autoridad municipal su voluntad de separarse.

                *¿Para qué es necesario?*

                La separación convencional sirve para que los cónyuges formalicen su decisión de vivir separados sin disolver inmediatamente el matrimonio.

  # >> 4.4... NECESIDAD
  utter_registro_item04_necesidad:
    - custom:
        blocks:
          - type: "text"
            text:
              preview_url: false
              body: |
                1. Solicitud al alcalde manifestando su voluntad de separación, con DNI, dirección, firma y huella de los cónyugues.

                2. Copia certificada del acta o de la partida de matrimonio.

                3. Declaración jurada del último domicilio conyugal.

                4. En caso de haber representantes, adjuntar un poder notarial específico registrado.

                5. Exhibición de los DNI de ambos cónyuges y de los representantes legales, si los hay.

                6. Indicar fecha y número de constancia de pago.

  # >> 4.4... COSTO
  utter_registro_item04_costo:
    - custom:
        blocks:
          - type: "text"
            text:
              preview_url: false
              body: |
                S/ 372.30
