version: "3.1"

intents:
  - obras_item01_consulta
  - obras_item01_necesidad
  - obras_item01_costo

responses:
  # >> 5.1. CERTIFICADO DE PARÁMETROS
  utter_obras_item01:
    - custom:
        blocks:
          - type: interactive
            interactive:
              type: list
              body:
                text: |
                  🎉 Has seleccionado *Certificado de Parámetros Urbanísticos y Edificatorios*

                  ❓ *Opciones de pregunta:*

                  1. 📄 ¿Qué es?

                  2. 📋 ¿Qué necesito?

                  3. 💵 ¿Cuánto cuesta el derecho de trámite?
              footer:
                text: "*Seleccione la opción abajo* 👇"

              action:
                sections:
                  - title: "Escoge la pregunta"
                    rows:
                      - id: "/obras_item01_consulta"
                        title: "📄 ¿Qué es?"
                      - id: "/obras_item01_necesidad"
                        title: "📋 ¿Qué necesito?"
                      - id: "/obras_item01_costo"
                        title: "💵 ¿Cuánto cuesta?"
                button: "✅ Opciones"

  # >> 5.1... CONSULTA
  utter_obras_item01_consulta:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                📜 Es el documento que te permite saber los requisitos técnicos de diseño de una edificación, por ejemplo alturas máximas, retiros municipales, porcentaje de área libre, cantidad de estacionamientos, etc.

                *¿Para qué es necesario?*

                🏗️ Para construir, para vender, alquilar, trámites en el banco y temas académicos.

  # >> 5.1... NECESIDAD
  utter_obras_item01_necesidad:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                📋 *Requisitos para el trámite:*

                1. 🖊️ Solicitud dirigida al alcalde.

                2. 📍 Indicar la dirección exacta del predio.

                3. 📂 Escribir el numero de partida registral.

  # >> 5.1... COSTO
  utter_obras_item01_costo:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                *Costo del trámite* 👇

                💰 S/ 57.10
