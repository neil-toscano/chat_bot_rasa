version: "3.1"

intents:
  - obras_item04_consulta
  - obras_item04_necesidad
  - obras_item04_costo

responses:
  # >> 5.4. LICENCIA DEMOLICIÓN
  utter_obras_item04:
    - custom:
        blocks:
          - type: interactive
            interactive:
              type: list
              body:
                text: |
                  🏗️ Has seleccionado *Licencia de Edificación Modalidad a: Aprobación Automática con firma de profesionales para Demolición Total de Edificaciones de hasta tres (03) pisos de altura, que no cuenten con semisótanos y sótanos, siempre que no haga uso de explosivos.*

                  ❓ *Opciones de pregunta:*

                  1. 📄 ¿Qué es?

                  2. 📋 ¿Qué necesito?

                  3. 💵 ¿Cuánto cuesta el derecho de trámite?
              footer:
                text: "*Seleccione la pregunta abajo 👇*"

              action:
                sections:
                  - title: "Escoge la pregunta"
                    rows:
                      - id: "/obras_item04_consulta"
                        title: "📄 ¿Qué es?"
                      - id: "/obras_item04_necesidad"
                        title: "📋 ¿Qué necesito?"
                      - id: "/obras_item04_costo"
                        title: "💵 ¿Cuánto cuesta?"
                button: "✅ Opciones"

  # >> 5.4... CONSULTA
  utter_obras_item04_consulta:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                📜 Es el permiso que entrega la municipalidad antes de eliminar una construcción de hasta 3 pisos de altura.

                *¿Para qué es necesario?*

                🏗️ Para facilitar la construcción de una edificación nueva.

  # >> 5.4... NECESIDAD
  utter_obras_item04_necesidad:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: true
              body: |
                📋 Formulario Único de Edificación - FUE:

                🔗 https://web.munisjl.gob.pe/web/pdf/edificacion/II-FUE_%20ANEXO%20II_LICENCIA%20DE%20OBRA_REV.pdf

          - type: text
            text:
              preview_url: true
              body: |
                📋 Datos de Condóminos en caso de ser persona natural:

                🔗 https://web.munisjl.gob.pe/web/pdf/edificacion/V-FUE_ANEXO%20A_PERSONAS%20NATURALES.pdf

          - type: text
            text:
              preview_url: true
              body: |
                📋 Datos de Condóminos en caso de ser persona jurídica:

                🔗 https://web.munisjl.gob.pe/web/pdf/edificacion/VI-FUE_ANEXO%20B_PERSONAS%20JUR%C3%8DDICAS_REV.pdf

          - type: text
            text:
              preview_url: false
              body: |
                📋 *Requisitos adicionales:*

                1. 📄 Documento que acredite el derecho a edificar.

                2. 🏢 Declaratoria de fábrica con respectivos planos.

                3. 💿 CD con información en digital.

                4. 📍 Plano de ubicación y localización.

                5. 📑 Carta de seguridad de obra.

                6. ✍️ Memoria descriptiva del proceso de demolición (Firmada por Ingeniero Civil).

                7. 🚧 Plano cerramiento del predio.

  # >> 5.4... COSTO
  utter_obras_item04_costo:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                *Costo del trámite* 👇
                
                💰 S/ 450.30
