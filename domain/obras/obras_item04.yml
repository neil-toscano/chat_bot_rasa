version: "3.1"

intents:
  - obras_item04_consulta
  - obras_item04_necesidad
  - obras_item04_costo

responses:
  # >> 5.4. LICENCIA DEMOLICIÓN
  utter_obras_item04:
    - custom:
        blocks:
          - type: interactive
            interactive:
              type: list
              # header:
              #   type: text
              #   text: "Consulta Trámites"
              body:
                text: |
                  *🏗️ Haz seleccionado Licencia de Edificación Modalidad A: Aprobación Automática con firma de profesionales - Demolición Total de Edificaciones de hasta tres (03) pisos de altura, que no cuenten con semisótanos y sótanos, siempre que no haga uso de explosivos.*

                  *❓ Opciones de pregunta:*

                  1. 📄¿Qué es?

                  2. 📋¿Qué necesito?

                  3. 💵¿Cuánto cuesta el derecho de trámite?
              footer:
                text: "*Seleccione la pregunta abajo 👇*"

              action:
                sections:
                  - title: "Escoge la pregunta"
                    rows:
                      - id: "/obras_item04_consulta"
                        title: "Pregunta 1"
                        description: "¿Qué es? 📄"
                      - id: "/obras_item04_necesidad"
                        title: "Pregunta 2"
                        description: "¿Qué necesito? 📋"
                      - id: "/obras_item04_costo"
                        title: "Pregunta 3"
                        description: "¿Cuánto cuesta? 💵"
                button: "✅ Opciones"

  # >> 5.4... CONSULTA
  utter_obras_item04_consulta:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                📜 Es el permiso que entrega la municipalidad antes de eliminar una construcción de hasta 3 pisos de altura.

                *🏗️ ¿Para qué es necesario?*

                Para facilitar la construcción de una edificación nueva.

  # >> 5.4... NECESIDAD
  utter_obras_item04_necesidad:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                *📋 Requisitos para el trámite:*

                1. 🖊️ FUE - Licencia de Edificación FUE - ANEXO A o B.

                2. 📄 Documento que acredite el derecho a edificar.

                3. 🏢 Declaratoria de fábrica con respectivos planos.

                4. 💿 CD con información en digital.

                5. 📍 Plano de ubicación y localización.

                6. 📑 Carta de seguridad de obra.

                7. ✍️ Memoria descriptiva del proceso de demolición (Firmada por Ingeniero Civil).

                8. 🚧 Plano cerramiento del predio.

  # >> 5.4... COSTO
  utter_obras_item04_costo:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                💰 *Costo del trámite:* S/ 450.30
