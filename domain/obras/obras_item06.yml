  # >> 5.6... CONSULTA
  utter_obras_item06_consulta:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                📜 Es el registro de la división de un terreno o propiedad en lotes individuales.

                *🏘️ ¿Para qué es necesario?*

                Para formalizar y legalizar la subdivisión, permitiendo que cada lote tenga su propia partida registral y pueda ser vendido o gestionado independientemente.

  # >> 5.6... NECESIDAD
  utter_obras_item06_necesidad:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                *📋 Requisitos para el trámite:*

                1. 📄 Copia literal o partida electrónica con todos los asientos.

                2. 📜 Certificados literales o partidas electrónicas de las unidades inmobiliarias, secciones, sublotes y otros.

                3. 🆔 Exhibición del DNI.

  # >> 5.6... COSTO
  utter_obras_item06_costo:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                💰 *Costo del trámite:* GRATUITO
