version: "3.1"

intents:
  - obras_item02_consulta
  - obras_item02_necesidad
  - obras_item02_costo

responses:
  # >> 5.2. VISACIÓN DE PLANOS
  utter_obras_item02:
    - custom:
        blocks:
          - type: interactive
            interactive:
              type: list
              # header:
              #   type: text
              #   text: "Consulta Trámites"
              body:
                text: |
                  *🏢 Haz seleccionado Visación de Planos para Trámites de Prescripción Adquisitiva de Dominio, Título Supletorio y Rectificación de Linderos y Áreas (Para predios urbanos)*

                  *❓ Opciones de pregunta:*

                  1. 📄¿Qué es?

                  2. 📋¿Qué necesito?

                  3. 💵¿Cuánto cuesta el derecho de trámite?
              footer:
                text: "*Seleccione la pregunta abajo 👇*"

              action:
                sections:
                  - title: "Escoge la pregunta"
                    rows:
                      - id: "/obras_item02_consulta"
                        title: "¿Qué es? 📄"
                      - id: "/obras_item02_necesidad"
                        title: "¿Qué necesito? 📋"
                      - id: "/obras_item02_costo"
                        title: "¿Cuánto cuesta? 💵"
                button: "✅ Opciones"

  # >> 5.2... CONSULTA
  utter_obras_item02_consulta:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                📜 Es cuando la municipalidad verifica y garantiza de manera técnica la documentación con predio.

                *🏗️ ¿Para qué es necesario?*

                Para prescripción adquisitiva de dominio, título supletorio, rectificación de linderos y medidas perimétricas.

  # >> 5.2... NECESIDAD
  utter_obras_item02_necesidad:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                *📋 Requisitos para el trámite:*

                1. 🖊️Solicitud dirigida al alcalde.

                2. 📍Plano de ubicación y localización (2 juegos originales).

                3. 📐Planos perimétricos (2 juegos originales).

                4. 📝Memoria descriptiva (2 juegos originales).

  # >> 5.2... COSTO
  utter_obras_item02_costo:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                💰 *Costo del trámite:* S/ 153.30
