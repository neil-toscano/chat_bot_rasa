version: "3.1"

intents:
  - obras_item05_consulta
  - obras_item05_necesidad
  - obras_item05_costo

responses:
  # >> 5.5. COMPRA-VENTA
  utter_obras_item05:
    - custom:
        blocks:
          - type: interactive
            interactive:
              type: list
              # header:
              #   type: text
              #   text: "Consulta Trámites"
              body:
                text: |
                  *🏘️ Haz seleccionado Inscripción por Compra-Venta*

                  *❓ Opciones de pregunta:*

                  1. 📄 ¿Qué es?

                  2. 📋 ¿Qué necesito?

                  3. 💵 ¿Cuánto cuesta el derecho de trámite?
              footer:
                text: "*Seleccione la pregunta abajo 👇*"

              action:
                sections:
                  - title: "Escoge la pregunta"
                    rows:
                      - id: "/obras_item05_consulta"
                        title: "Pregunta 1"
                        description: "¿Qué es? 📄"
                      - id: "/obras_item05_necesidad"
                        title: "Pregunta 2"
                        description: "¿Qué necesito? 📋"
                      - id: "/obras_item05_costo"
                        title: "Pregunta 3"
                        description: "¿Cuánto cuesta? 💵"
                button: "✅ Opciones"

  # >> 5.5... CONSULTA
  utter_obras_item05_consulta:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                📜 Es el registro formal de la transferencia de propiedad de un inmueble en la municipalidad.

                *🏘️ ¿Para qué es necesario?*

                Para legalizar y actualizar el cambio de propietario ante los registros municipales.

  # >> 5.5... NECESIDAD
  utter_obras_item05_necesidad:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                *📋 Requisitos para el trámite:*

                1. 🖊️ Minuta con número de KARDEX o escritura pública.

                2. 📄 Copia literal.

  # >> 5.5... COSTO
  utter_obras_item05_costo:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                💰 *Costo del trámite:* GRATUITO
