version: "3.1"

intents:
  - orientacion_item01_consulta
  - orientacion_item01_necesidad
  - orientacion_item01_costo

responses:
  # >> 3.1. SUCESIÓN INDIVISA
  utter_orientacion_item01:
    - custom:
        blocks:
          - type: interactive
            interactive:
              type: list
              #header:
              #  type: text
              #  text: "Consulta Trámites"
              body:
                text: |
                  Haz seleccionado 📜 *Inscripción por Sucesión Indivisa*

                  *🟢 Opciones de pregunta:* 

                  1️. 📘¿Qué es?  

                  2️. 📝¿Qué necesito?  

                  3️. 💰¿Cuánto cuesta el derecho de trámite?  

            footer:
              text: "*Seleccione la pregunta abajo 👇*"

              action:
                sections:
                  - title: "Escoge la pregunta"
                    rows:
                      - id: "/orientacion_item01_consulta"
                        title: "Pregunta 1"
                        description: "📘 ¿Qué es?"
                      - id: "/orientacion_item01_necesidad"
                        title: "Pregunta 2"
                        description: "📝¿Qué necesito?"
                      - id: "/orientacion_item01_costo"
                        title: "Pregunta 3"
                        description: "💰 ¿Cuánto cuesta?"
                button: "Opciones"

  # >> 3.1... CONSULTA
  utter_orientacion_item01_consulta:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                  🏠 Es el registro en la municipalidad de un bien inmueble, cuando varios herederos comparten la propiedad sin dividirla formalmente.
                  
                  *¿Para qué es necesario?*

                  📜 Para reconocer legalmente a los herederos como propietarios conjuntos del inmueble.

  # >> 3.1... NECESIDAD
  utter_orientacion_item01_necesidad:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                  1. 📜 Acta de defunción

                  2. 📝 Partida de nacimiento o partida de matrimonio; según corresponda.

                  3. 🆔 Exhibición del DNI de quienes correspondan.

                  4. 📑 Documento que acredite la propiedad del bien del fallecido.

  # >> 3.1... COSTO
  utter_orientacion_item01_costo:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                  💸 GRATUITO
