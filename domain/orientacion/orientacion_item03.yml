version: "3.1"

intents:
  - orientacion_item03_consulta
  - orientacion_item03_necesidad
  - orientacion_item03_costo

responses:
  # >> 3.3. COMPRA-VENTA
  utter_orientacion_item03:
    - custom:
        blocks:
          - type: interactive
            interactive:
              type: list
              #header:
              #  type: text
              #  text: "Consulta Trámites"
              body:
                text: |
                  Haz seleccionado 💼 *Inscripción por Compra-Venta*

                  *🟢 Opciones de pregunta:*  

                  1️. 📘¿Qué es?  

                  2️. 📝¿Qué necesito?  

                  3️. 💰¿Cuánto cuesta el derecho de trámite?

              footer:
                text: "*Seleccione la opción abajo 👇*"

              action:
                sections:
                  - title: "Escoge la pregunta"
                    rows:
                      - id: "/orientacion_item02_consulta"
                        title: "¿Qué es?"
                      - id: "/orientacion_item02_necesidad"
                        title: "¿Qué necesito?"
                      - id: "/orientacion_item02_costo"
                        title: "¿Cuánto cuesta?"
                button: "Opciones"

  # >> 3.3... CONSULTA
  utter_orientacion_item03_consulta:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                📜 Es el registro formal de la transferencia de propiedad de un inmueble en la municipalidad.

                *🏘️ ¿Para qué es necesario?*

                Para legalizar y actualizar el cambio de propietario ante los registros municipales.

  # >> 3.3... NECESIDAD
  utter_orientacion_item03_necesidad:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                *📋 Requisitos para el trámite:*

                1. 🖊️ Minuta con número de KARDEX o escritura pública.

                2. 📄 Copia literal.

  # >> 3.3... COSTO
  utter_orientacion_item03_costo:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                💸 GRATUITO
