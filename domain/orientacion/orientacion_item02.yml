version: "3.1"

intents:
  - orientacion_item02_consulta
  - orientacion_item02_necesidad
  - orientacion_item02_costo

responses:
  # >> 3.2. SUCESIÓN INTESTADA
  utter_orientacion_item02:
    - custom:
        blocks:
          - type: interactive
            interactive:
              type: list
              #header:
              #  type: text
              #  text: "Consulta Trámites"
              body:
                text: |
                  Haz seleccionado 🏠 *Inscripción por Sucesión Intestada*

                  *🟢 Opciones de pregunta:*  

                  1️. 📘¿Qué es?  

                  2️. 📝¿Qué necesito?  

                  3️. 💰¿Cuánto cuesta el derecho de trámite?

                  ↪️ Puedes Iniciar trámite para solicitar cita para la inscripción por suceción intestada en el siguiente link  👉: http://gestioncitas.munisjl.gob.pe/

              footer:
                text: "*Seleccione la opción abajo 👇*"

              action:
                sections:
                  - title: "Escoge la pregunta"
                    rows:
                      - id: "/orientacion_item02_consulta"
                        title: "¿Qué es?"
                      - id: "/orientacion_item02_necesidad"
                        title: "¿Qué necesito?"
                      - id: "/orientacion_item02_costo"
                        title: "¿Cuánto cuesta?"
                button: "Opciones"

  # >> 3.2... CONSULTA
  utter_orientacion_item02_consulta:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                ⚖️ Es el registro de la transferencia de bienes de una persona fallecida sin testamento.

                *¿Para qué es necesario?*

                📜 Para reconocer legalmente a los herederos y actualizar los registros con los nuevos propietarios según las leyes de sucesión.

  # >> 3.2... NECESIDAD
  utter_orientacion_item02_necesidad:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                1. 📜 Copia literal de la sucesión intestada.

                2. 🏠 Documento que acredite la propiedad del bien inmueble a nombre del fallecido.

                3. 🆔 Exhibición del DNI de los herederos.

  # >> 3.2... COSTO
  utter_orientacion_item02_costo:
    - custom:
        blocks:
          - type: text
            text:
              preview_url: false
              body: |
                💸 GRATUITO
