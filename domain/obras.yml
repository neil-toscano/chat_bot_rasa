responses:
  # >> 5. OBRAS PRIVADAS Y HABILITACIÓN URBANA :
  utter_obras:
    - custom:
        blocks:
          - type: interactive
            interactive:
              type: list
              header:
                type: text
                text: "🟢 Opciones de Trámite:"
              body:
                text: |
                  1. 🏢Certificado de Parámetros Urbanísticos y Edificatorios

                  2. 📐Visación de Planos para Trámites de Prescripción Adquisitiva de Dominio, Título Supletorio y Rectificación de Linderos y Áreas (Para predios urbanos)

                  3. 🏠Licencia de Edificación Modalidad a: Aprobación Automática con firma de profesionales para construcción de una Vivienda Unifamiliar de hasta 120 m2 construidos, siempre que constituya la única edificación en el lote

                  4. 🔨Licencia de Edificación Modalidad a: Aprobación Automática con firma de profesionales para Demolición Total de Edificaciones de hasta tres (03) pisos de altura, que no cuenten con semisótano y sótanos, siempre que no haga uso de explosivos

                  5. 📝Inscripción por Compra-Venta

                  6. 🗂️Inscripción de una Independización o Subdivisión de Lotes

              footer:
                text: "*Seleccione la opción abajo 👇*"

              # >> LISTADO DE OPCIONES :
              action:
                sections:
                  - title: "Escoge la "
                    rows:
                      - id: "/obras_item01"
                        title: "📝 CERTIFICADO"
                      - id: "/obras_item02"
                        title: "✏️ VISACIÓN"
                      - id: "/obras_item03"
                        title: "🛠️ LICENCIA CONSTRUCCIÓN"
                      - id: "/obras_item04"
                        title: "🏚️ LICENCIA DEMOLICIÓN"
                      - id: "/obras_item05"
                        title: "🤝 COMPRA-VENTA"
                      - id: "/obras_item06"
                        title: "📂 INDEPENDIZACIÓN"
                button: "Seleccionar opción"
