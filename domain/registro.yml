responses:
  # >> 4. REGISTRO CIVIL :
  utter_registro:
    - custom:
        blocks:
          - type: interactive
            interactive:
              type: list
              header:
                type: text
                text: "🟢 Opciones de Trámite:"
              body:
                text: |
                  1. 💍 Matrimonio Civil  

                  2. 📜 Publicación de Edicto Matrimonial tramitado en otros distritos  

                  3. 🔄 Reprogramación de fecha y hora de Ceremonia Matrimonial  

