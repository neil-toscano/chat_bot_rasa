                        description: "💍 MATRIMONIO"
                      - id: "/registro_item02"
                        title: "Opción 2"
                        description: "📜 PUBLICACIÓN"
                      - id: "/registro_item03"
                        title: "Opción 3"
                        description: "🔄 REPROGRAMACIÓN"
                      - id: "/registro_item04"
                        title: "Opción 4"
                        description: "💔 SEPARACIÓN"
                button: "Selecciona Opción"
